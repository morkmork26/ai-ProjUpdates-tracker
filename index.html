<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58a6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AI Tracker - All Projects</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;padding:24px}
:root{--c-done:#3fb950;--c-prog:#58a6ff;--c-blocked:#d29922;--c-ns:#8b949e;--c-muted:#484f58;--c-red:#f85149;--c-purple:#a371f7;--pop-bg:linear-gradient(135deg,#161b22,#1c2128);--pop-border:#30363d;--pop-text:#c9d1d9;--pop-sub:#8b949e;--pop-title:#58a6ff;--pop-btn:#238636;--pop-shadow:0 16px 48px rgba(0,0,0,.5);--pop-overlay:rgba(0,0,0,.7)}
input[type="date"]{color-scheme:dark}
h1{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#58a6ff,#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:#8b949e;margin-bottom:24px;font-size:0.9rem}
.summary{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.card{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:16px 24px;min-width:140px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card-value{font-size:2rem;font-weight:700}
.card-label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.card.notstarted .card-value{color:#8b949e}
.card.inprog .card-value{color:#58a6ff}
.card.blocked .card-value{color:#d29922}
.card.overdue .card-value{color:#f85149}
.card.done .card-value{color:#3fb950}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.tab{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
.tab:hover{border-color:#58a6ff;color:#58a6ff}
.tab.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.controls{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.btn.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.btn-add{border-color:#3fb950;color:#3fb950}
.btn-add:hover{background:#3fb95022}
.btn-proj{border-color:#a371f7;color:#a371f7;padding:6px 12px}
.btn-proj:hover{background:#a371f722}
.add-form{display:none;background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.add-form.open{display:block;animation:slideDown .3s ease}
.add-form::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#58a6ff,#a371f7,#3fb950)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseAmber{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px 12px;border-radius:8px;font-size:.85rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#58a6ff}
.form-group textarea{resize:vertical;min-height:60px}
.form-actions{margin-top:16px;display:flex;gap:12px}
.btn-submit{background:linear-gradient(135deg,#238636,#2ea043);border:none;color:#fff;padding:10px 24px;border-radius:8px;cursor:pointer;font-weight:600;transition:transform .2s}
.btn-submit:hover{transform:scale(1.02)}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #30363d}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:#161b22;padding:12px 16px;text-align:left;color:#8b949e;text-transform:uppercase;font-size:.7rem;letter-spacing:1px;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{color:#58a6ff}
th.ns{cursor:default}
th.ns:hover{color:#8b949e}
td{padding:12px 16px;border-top:1px solid #21262d;transition:opacity .3s}
tr:hover td{background:#161b2288}
tr.done-row td{opacity:.5}
tr.done-row .task-text{text-decoration:line-through}
.completed-at{display:block;font-size:.65rem;color:#8b949e;margin-top:2px}
.priority{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.priority-high{background:#f85149;box-shadow:0 0 6px #f8514966;animation:pulse 2s infinite}
.priority-med{background:#d29922}
.priority-low{background:#484f58}
.due-warning{color:#d29922;font-weight:600}
.due-overdue{color:#f85149;font-weight:600}
.empty{text-align:center;padding:48px;color:#8b949e}
.project-badge{background:#a371f722;color:#a371f7;padding:2px 8px;border-radius:4px;font-size:.75rem}
.checkbox{width:18px;height:18px;cursor:pointer;accent-color:#3fb950}
.notes-row{display:none}
.notes-row.open{display:table-row;animation:slideDown .2s ease}
.notes-row td{background:#161b22;padding:8px 16px 16px 60px}
.notes-textarea{width:100%;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px;border-radius:8px;font-size:.8rem;resize:vertical;min-height:50px}
.notes-textarea:focus{outline:none;border-color:#58a6ff}
.expand-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.8rem;transition:transform .2s,color .2s}
.expand-btn:hover{color:#58a6ff}
.expand-btn.open{transform:rotate(90deg)}
.edit-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:4px}
.edit-btn:hover{color:#58a6ff}
.delete-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:4px}
.delete-btn:hover{color:#f85149}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-content{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;min-width:320px}
.modal-content h3{color:#c9d1d9;margin-bottom:16px}
.progress-container{width:100%;height:6px;background:#21262d;border-radius:3px;margin-top:6px;cursor:pointer;position:relative;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s ease,background .3s ease}
.progress-fill.not-started{width:0%;background:#484f58}
.progress-fill.in-progress{width:50%;background:#58a6ff}
.progress-fill.blocked{width:50%;background:#d29922;animation:pulseAmber 2s infinite}
.progress-fill.done{width:100%;background:#3fb950}
.progress-label{font-size:.65rem;color:#8b949e;margin-top:3px}
.progress-label .stage{font-weight:600}
.progress-label .stage.not-started{color:#8b949e}
.progress-label .stage.in-progress{color:#58a6ff}
.progress-label .stage.blocked{color:#d29922}
.progress-label .stage.done{color:#3fb950}
.block-input{background:#0d1117;border:1px solid #d29922;color:#d29922;padding:4px 8px;border-radius:4px;font-size:.7rem;margin-top:3px;width:100%;max-width:250px}
.block-input:focus{outline:none;border-color:#58a6ff}
.task-cell{min-width:200px}
/* Sub-tasks: nested checklist */
:root{--st-text:#c9d1d9;--st-done:#8b949e;--st-line:#30363d;--st-hover:#161b22;--st-ghost:#8b949e;--st-chip-bg:#21262d;--st-chip-fg:#c9d1d9;--st-ring-track:#3d444d;--st-ring-fill:#58a6ff;--st-accent:#58a6ff;--st-del:#f85149;--st-ok:#3fb950;--st-ok-bg:#3fb95022;--st-ns:#8b949e;--st-prog:#58a6ff;--st-blocked:#d29922;--st-input-bg:#0d1117;--st-input-border:#30363d;--st-focus:#58a6ff55}
.row-actions{display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
.add-sub-btn{background:none;border:1px solid transparent;color:var(--st-ghost);cursor:pointer;font:inherit;font-size:.7rem;font-weight:600;padding:2px 7px;border-radius:4px;margin-right:2px;transition:all .15s}
.add-sub-btn:hover,.add-sub-btn:focus-visible{color:var(--st-accent);background:var(--st-chip-bg)}
tr.st-open td{padding-bottom:8px}
.st-row td{padding:0 16px 10px;border-top:none}
.st-row td.st-gutter{padding:0}
tr.st-row:hover td{background:transparent}
.st-list{margin:0 0 0 4px;padding:2px 0 2px 12px;border-left:2px solid var(--st-line);max-width:640px}
.st-list.st-anim{animation:stOpen .2s ease both}
.st-list.st-closing{animation:stClose .16s ease both}
@keyframes stOpen{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes stClose{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-4px)}}
@keyframes stPop{0%{transform:scale(1)}45%{transform:scale(1.6)}100%{transform:scale(1)}}
.st-item{display:flex;align-items:center;gap:6px;min-height:30px;padding:2px 4px;margin-left:-4px;border-radius:6px;transition:background .15s}
.st-item:hover,.st-item:focus-within{background:var(--st-hover)}
.st-dot{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center}
.st-dot::before{content:'';width:7px;height:7px;border-radius:50%;border:1.5px solid var(--st-ns);transition:background .2s,border-color .2s}
.st-d-in-progress::before{background:var(--st-prog);border-color:var(--st-prog)}
.st-d-blocked::before{background:var(--st-blocked);border-color:var(--st-blocked)}
.st-d-done::before{background:var(--st-ok);border-color:var(--st-ok)}
.just-toggled .st-dot::before{animation:stPop .3s ease}
.st-text{flex:0 1 auto;min-width:0;font-size:.82rem;line-height:1.4;color:var(--st-text);overflow-wrap:anywhere;cursor:text;transition:color .2s}
.is-done .st-text{color:var(--st-done);text-decoration:line-through;text-decoration-color:var(--st-done)}
.st-meta{display:inline-flex;align-items:center;gap:6px;flex:none}
.st-status{border:none;font:inherit;font-size:.65rem;font-weight:600;padding:1px 8px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;line-height:1.6}
.st-status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.st-s-in-progress{background:#58a6ff1f;color:#58a6ff}
.st-s-blocked{background:#d299221f;color:#d29922}
.st-block{background:var(--st-input-bg);border:1px solid #d29922;color:#d29922;padding:2px 8px;border-radius:6px;font:inherit;font-size:.7rem;width:170px;max-width:40vw}
.st-block:focus{outline:none;box-shadow:0 0 0 3px var(--st-focus)}
.st-due{font-size:.65rem;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--st-chip-bg);color:var(--st-done)}
.st-due.due-warning{color:#d29922}.st-due.due-overdue{color:#f85149}
.st-actions{display:inline-flex;align-items:center;gap:2px;flex:none;opacity:0;transition:opacity .15s}
.st-item:hover .st-actions,.st-item:focus-within .st-actions{opacity:1}
.st-edit{flex:1 1 auto;min-width:120px;max-width:460px;background:var(--st-input-bg);border:1px solid var(--st-accent);color:var(--st-text);font:inherit;font-size:.82rem;padding:3px 8px;border-radius:6px;outline:none;box-shadow:0 0 0 3px var(--st-focus)}
.st-add{display:flex;align-items:center;gap:6px;min-height:30px;padding:2px 4px;margin-left:-4px;border-radius:6px}
.st-plus{flex:none;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--st-ghost);font-size:.95rem;font-weight:600;line-height:1;cursor:pointer;transition:color .15s}
.st-add-btn{background:none;border:none;color:var(--st-ghost);font:inherit;font-size:.8rem;cursor:pointer;padding:2px 4px;border-radius:4px;transition:color .15s}
.st-add:hover .st-plus,.st-add:hover .st-add-btn,.st-add-btn:focus-visible,.st-add.editing .st-plus{color:var(--st-accent)}
.st-add-input{display:none;flex:1 1 auto;min-width:0;max-width:420px;background:var(--st-input-bg);border:1px solid var(--st-input-border);color:var(--st-text);font:inherit;font-size:.82rem;padding:4px 8px;border-radius:6px;outline:none;transition:border-color .15s,box-shadow .15s}
.st-add-input:focus{border-color:var(--st-accent);box-shadow:0 0 0 3px var(--st-focus)}
.st-add-hint{display:none;font-size:.65rem;color:var(--st-done);white-space:nowrap}
.st-add.editing .st-add-btn{display:none}
.st-add.editing .st-add-input{display:block}
.st-add.editing .st-add-hint{display:inline}
.st-add-cancel{display:none}
.undo-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);background:#1f2937;color:#f9fafb;border:1px solid #374151;padding:8px 16px;border-radius:8px;font-size:.82rem;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:9999}
.undo-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.undo-toast{transition:none}}
.st-add.editing .st-add-cancel{display:inline-flex}
.st-chip{display:inline-flex;align-items:center;gap:5px;margin-left:8px;padding:1px 7px 1px 4px;border:1px solid transparent;border-radius:999px;background:var(--st-chip-bg);color:var(--st-chip-fg);font:inherit;font-size:.66rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.6;cursor:pointer;vertical-align:middle;transition:background .15s,border-color .15s,color .15s}
.st-chip:hover,.st-chip:focus-visible{border-color:var(--st-accent);color:var(--st-accent)}
.st-chip.complete{background:var(--st-ok-bg);color:var(--st-ok)}
.st-ring{width:11px;height:11px;border-radius:50%;background:conic-gradient(var(--st-ring-fill) calc(var(--p,0)*1%),var(--st-ring-track) 0);-webkit-mask:radial-gradient(circle,transparent 2.5px,#000 3px);mask:radial-gradient(circle,transparent 2.5px,#000 3px)}
.st-chip.complete .st-ring{background:var(--st-ok)}
.st-caret{display:inline-block;font-size:.75rem;line-height:1;transition:transform .2s}
.st-chip.open .st-caret{transform:rotate(90deg)}
.st-compact{margin:8px 0 0 2px;max-width:none}
.st-compact .st-item,.st-compact .st-add{min-height:26px}
.st-compact .st-text,.st-compact .st-add-btn,.st-compact .st-add-input{font-size:.74rem}
.kc-meta .st-chip,.mc-meta .st-chip,.mobile-card-meta .st-chip{margin-left:0}
.mc-compact .st-list{display:none}
@media(hover:none){.st-actions,.mc-actions{opacity:1}}
@media(prefers-reduced-motion:reduce){.st-list.st-anim,.st-list.st-closing,.just-toggled .st-dot::before{animation:none}.st-item,.st-actions,.st-text,.st-caret,.st-dot::before,.st-chip{transition:none}}
@media(max-width:768px){
.summary{flex-direction:row;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex-wrap:nowrap}
.summary::-webkit-scrollbar{display:none}
.summary .card{min-width:110px;flex-shrink:0;padding:12px 14px}
.summary .card-value{font-size:1.5rem}
.form-grid{grid-template-columns:1fr}
.table-wrap{display:none}
.mobile-cards{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.mobile-cards.hidden{display:none!important}
.tabs{gap:6px}
.tab{padding:6px 12px;font-size:.75rem}
.controls{flex-direction:column;gap:8px}
.wins-header{flex-direction:row;justify-content:space-between;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
.wins-header::-webkit-scrollbar{display:none}
.wins-stat{min-width:0;flex:1;padding:12px 10px;flex-shrink:0}
.wins-stat .ws-val{font-size:1.3rem}
.win-card{padding:12px 14px}
.win-card .win-meta{flex-direction:column;gap:4px}
.week-header{flex-wrap:wrap;gap:8px}
.week-divider{flex-wrap:wrap;gap:6px}
.timeline-entry{flex-direction:column;gap:6px}
.timeline-entry .entry-date{min-width:unset;display:flex;gap:8px;align-items:center}
.update-form .form-grid{grid-template-columns:1fr}
}
.mobile-cards{display:none}
.mobile-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;position:relative;overflow:hidden}
.mobile-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
.mobile-card.mc-blocked::before{background:#d29922}
.mobile-card.mc-in-progress::before{background:#58a6ff}
.mobile-card.mc-overdue::before{background:#f85149}
.mobile-card.mc-done::before{background:#3fb950}
.mobile-card.mc-done{opacity:.5}
.mobile-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.mobile-card-title{font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:6px;flex:1}
.mobile-card-title .task-text-m{flex:1}
.mobile-card-meta{display:flex;gap:12px;font-size:.7rem;color:#8b949e;margin-bottom:6px;flex-wrap:wrap}
.mobile-card-actions{display:flex;gap:8px;align-items:center}
.mobile-card-actions button{background:none;border:none;color:#484f58;font-size:1rem;cursor:pointer;padding:4px}
.mobile-card-progress{margin-top:6px}
.mobile-subtasks{margin-top:10px;padding-top:8px;border-top:1px solid #21262d}
.mobile-subtasks .st-list{margin-left:2px;max-width:none}
.mobile-card-actions .mc-act-btn{font-size:.9rem;border-radius:8px;color:#8b949e}
.mc-act-btn.mc-done-btn,.mobile-card-actions .mc-act-btn.mc-done-btn{background:#3fb95014;color:#3fb950}
.mc-act-btn.mc-done-btn:hover,.mobile-card-actions .mc-act-btn.mc-done-btn:hover{background:#3fb95026;color:#3fb950}
.mobile-card-actions .add-sub-btn{color:var(--st-ghost);font-size:.72rem}
@media(max-width:768px){
.st-item,.st-add{min-height:44px}
.st-text{flex:1 1 auto;font-size:.86rem}
.st-actions .mc-act-btn,.st-add-btn{min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.st-actions{opacity:1}
.st-add-btn{justify-content:flex-start}
.st-chip{position:relative;min-height:32px;padding:4px 10px 4px 6px;font-size:.72rem}
.st-chip::after{content:'';position:absolute;top:-6px;bottom:-6px;left:-4px;right:-4px}
.st-add-input,.st-edit,.st-block{min-height:40px;font-size:16px}
.matrix-card .mc-actions,.kanban-card .mc-actions{position:static;opacity:1;justify-content:flex-end;margin-top:6px}
.matrix-card .mc-act-btn,.kanban-card .mc-act-btn{min-width:44px;min-height:44px}
}
/* Mobile form backdrop */
.form-backdrop{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:899;backdrop-filter:blur(2px)}
@media(max-width:768px){.form-backdrop.open{display:block}}

/* Updates Tab Styles */
.updates-container{display:none;animation:slideDown .3s ease}
.updates-container.open{display:block}
.updates-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.updates-filter .filter-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.updates-filter .filter-btn:hover{border-color:#a371f7;color:#a371f7}
.updates-filter .filter-btn.active{background:#a371f722;border-color:#a371f7;color:#a371f7}
.update-form{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:20px;margin-bottom:24px;position:relative;overflow:hidden}
.update-form::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#a371f7,#58a6ff,#3fb950)}
.update-form .form-grid{display:grid;grid-template-columns:180px 150px 1fr auto;gap:12px;align-items:end}
.update-form .form-grid textarea{min-height:38px;resize:none}
@media(max-width:768px){.update-form .form-grid{grid-template-columns:1fr}}
.timeline{display:flex;flex-direction:column;gap:16px}
.timeline-group{margin-bottom:24px}
.timeline-group-header{font-size:1rem;font-weight:700;color:#a371f7;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px}
.timeline-group-header .count-badge{background:#a371f722;color:#a371f7;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.timeline-entry{display:flex;gap:12px;padding:14px 16px;background:#161b22;border:1px solid #30363d;border-radius:10px;border-left:3px solid #a371f7;transition:transform .2s,box-shadow .2s}
.timeline-entry:hover{transform:translateX(4px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.timeline-entry .entry-date{min-width:90px;font-size:.75rem;color:#58a6ff;font-weight:600;padding-top:2px}
.timeline-entry .entry-text{flex:1;font-size:.85rem;line-height:1.5;color:#c9d1d9}
.timeline-entry .entry-delete{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:2px 6px;transition:color .2s}
.timeline-entry .entry-delete:hover{color:#f85149}
.timeline-entry .entry-date,.timeline-entry .entry-text{cursor:pointer;border-radius:4px;padding:2px 4px;transition:background .2s}
.timeline-entry .entry-date:hover,.timeline-entry .entry-text:hover{background:rgba(88,166,255,.1)}
.timeline-entry .entry-date .edit-date{width:110px;background:#0d1117;border:1px solid #58a6ff;color:#c9d1d9;border-radius:4px;padding:2px 4px;font-size:.75rem}
.timeline-entry .entry-text .edit-text{width:100%;background:#0d1117;border:1px solid #58a6ff;color:#c9d1d9;border-radius:4px;padding:4px 6px;font-size:.85rem;font-family:inherit;resize:vertical;min-height:32px}
.timeline-entry .edit-project{background:#0d1117;border:1px solid #a371f7;color:#c9d1d9;border-radius:4px;padding:1px 4px;font-size:.65rem;margin-top:2px}
.timeline-empty{text-align:center;padding:48px;color:#8b949e;font-size:.9rem}

/* Wins / History Styles */
.wins-container{display:none;animation:slideDown .3s ease}
.wins-container.open{display:block}
.wins-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.wins-stat{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:14px 20px;text-align:center;min-width:120px}
.wins-stat .ws-val{font-size:1.6rem;font-weight:700;color:#3fb950}
.wins-stat .ws-lbl{font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.wins-stat.streak .ws-val{color:#f0883e}
.week-section{margin-bottom:32px}
.week-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #21262d}
.week-header .wh-label{font-size:.95rem;font-weight:700;color:#3fb950}
.week-header .wh-range{font-size:.75rem;color:#8b949e}
.week-header .wh-count{background:#3fb95022;color:#3fb950;padding:3px 10px;border-radius:10px;font-size:.7rem;font-weight:600}
.week-header .wh-current{background:linear-gradient(135deg,#3fb950,#2ea043);color:#fff;padding:3px 10px;border-radius:10px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.win-card{display:flex;gap:14px;padding:14px 18px;background:#161b22;border:1px solid #30363d;border-radius:10px;border-left:3px solid #3fb950;margin-bottom:10px;transition:transform .2s,box-shadow .2s;align-items:flex-start}
.win-card:hover{transform:translateX(4px);box-shadow:0 4px 16px rgba(63,185,80,.1)}
.win-card .win-check{color:#3fb950;font-size:1.2rem;margin-top:2px}
.win-card .win-body{flex:1}
.win-card .win-task{font-size:.88rem;font-weight:600;color:#c9d1d9;margin-bottom:4px}
.win-card .win-meta{display:flex;gap:12px;font-size:.7rem;color:#8b949e;flex-wrap:wrap;align-items:center}
.win-card .win-meta .win-duration{background:#58a6ff22;color:#58a6ff;padding:2px 8px;border-radius:6px;font-weight:600}
.win-card .win-meta .win-added{color:#484f58}
.wins-empty{text-align:center;padding:48px;color:#8b949e}
.wins-empty .wins-empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}

/* Updates weekly dividers */
.week-divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;padding-bottom:8px;border-bottom:1px solid #21262d}
.week-divider .wd-label{font-size:.8rem;font-weight:700;color:#58a6ff}
.week-divider .wd-range{font-size:.7rem;color:#8b949e}
.week-divider .wd-count{background:#58a6ff22;color:#58a6ff;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600}

/* Search bar */
.search-input{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:8px 12px 8px 32px;border-radius:8px;font-size:.8rem;width:200px;transition:border-color .2s,width .2s}
.search-input:focus{outline:none;border-color:#58a6ff;width:260px}
.search-wrap{position:relative;display:inline-flex;align-items:center}
.search-wrap::before{content:'\1F50D';position:absolute;left:10px;font-size:.7rem;opacity:.5;pointer-events:none}

/* Kanban board */
.kanban-container{display:none;animation:slideDown .3s ease}
.kanban-container.open{display:block}
.kanban-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.kanban-col{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:12px;min-height:300px;overflow:hidden}
.kanban-col-header{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:8px 12px;border-radius:8px;margin-bottom:12px;text-align:center}
.kanban-col-header.kh-not-started{background:#8b949e22;color:#8b949e}
.kanban-col-header.kh-in-progress{background:#58a6ff22;color:#58a6ff}
.kanban-col-header.kh-blocked{background:#d2992222;color:#d29922}
.kanban-col-header.kh-done{background:#3fb95022;color:#3fb950}
.kanban-card{background:#0d1117;border:1px solid #30363d;border-radius:10px;padding:12px;margin-bottom:10px;transition:transform .2s,box-shadow .2s;cursor:grab;position:relative}
.kanban-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.4)}
.kanban-card.dragging{opacity:.4;transform:scale(.95)}
.kanban-col.drag-over{background:#58a6ff11;border-color:#58a6ff;box-shadow:inset 0 0 20px rgba(88,166,255,.1)}
.kanban-card .kc-project{margin-bottom:6px}
.kanban-card .kc-task{font-size:.82rem;font-weight:600;color:#c9d1d9;margin-bottom:8px;line-height:1.3;overflow-wrap:break-word;word-break:break-word}
.kanban-card .kc-meta{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:#8b949e}
.kanban-card .kc-due{font-size:.7rem}
.kanban-card .kc-priority{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%}
@media(max-width:768px){.kanban-board{grid-template-columns:1fr}}

/* Eisenhower Matrix */
.matrix-container{display:none;animation:slideDown .3s ease}
.matrix-container.open{display:block}
.matrix-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;margin-top:16px}
.matrix-axis-y{grid-column:1;grid-row:1;align-self:center;justify-self:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;line-height:1}
.matrix-axis-x{grid-column:2;grid-row:2;text-align:center;font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:2px;margin-top:8px}
.matrix-grid{grid-column:2;grid-row:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 1fr;gap:0;border:1px solid #30363d;border-radius:12px;overflow:hidden}
.matrix-col-labels{display:contents}
.matrix-col-label{padding:10px 16px;text-align:center;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;background:#161b22;border-bottom:1px solid #30363d;color:#8b949e}
.matrix-col-label:first-child{border-right:1px solid #30363d}
.matrix-quadrant{min-height:220px;padding:12px;position:relative;overflow:hidden;transition:background .2s}
.matrix-quadrant.drag-over{box-shadow:inset 0 0 20px rgba(88,166,255,.15)}
.mq-q1{background:#f8514908;border-right:1px solid #30363d;border-bottom:1px solid #30363d}
.mq-q2{background:#58a6ff08;border-bottom:1px solid #30363d}
.mq-q3{background:#d2992208;border-right:1px solid #30363d}
.mq-q4{background:#8b949e08}
.mq-header{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #21262d}
.mq-header .mq-icon{font-size:1rem}
.mq-header .mq-title{font-size:.78rem;font-weight:700;letter-spacing:.5px}
.mq-header .mq-count{font-size:.65rem;background:#21262d;padding:2px 8px;border-radius:8px;color:#8b949e}
.mq-add-btn{margin-left:auto;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;padding:0;background:transparent;border:1px solid #30363d;border-radius:6px;color:#8b949e;font-size:1rem;font-weight:600;line-height:1;cursor:pointer;font-family:inherit;transition:color .2s,border-color .2s,background .2s}
.mq-add-btn:hover,.mq-add-btn:focus-visible{color:#3fb950;border-color:#3fb950;background:#3fb95015}
.mq-q1 .mq-header .mq-title{color:#f85149}
.mq-q2 .mq-header .mq-title{color:#58a6ff}
.mq-q3 .mq-header .mq-title{color:#d29922}
.mq-q4 .mq-header .mq-title{color:#8b949e}
.matrix-card{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:grab;transition:transform .2s,box-shadow .2s;position:relative}
.matrix-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.4)}
.matrix-card.dragging{opacity:.4;transform:scale(.95)}
.matrix-card .mc-project{margin-bottom:4px}
.matrix-card .mc-task{font-size:.8rem;font-weight:600;color:#c9d1d9;line-height:1.3;margin-bottom:6px}
.matrix-card .mc-meta{display:flex;justify-content:space-between;align-items:center;font-size:.68rem;color:#8b949e}
.matrix-card .mc-due{font-size:.68rem}
.matrix-card .mc-priority{position:absolute;top:10px;right:10px;width:7px;height:7px;border-radius:50%}
.matrix-row-label{display:none}
@media(max-width:768px){
.matrix-wrap{display:block}
.matrix-grid{grid-template-columns:1fr}
.matrix-col-labels{display:none}
.matrix-axis-y{display:none}
.matrix-quadrant{min-height:120px;border-right:none!important;border-bottom:1px solid #30363d}
.matrix-row-label{display:block;font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.mq-add-btn{width:44px;height:44px;font-size:1.25rem;border-radius:10px}
}

/* Quadrant picker */
.quadrant-picker{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qp-btn{padding:8px 10px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#8b949e;font-size:.72rem;cursor:pointer;transition:all .2s;text-align:center;font-weight:500}
.qp-btn:hover{border-color:#58a6ff;color:#c9d1d9}
.qp-btn.active{font-weight:600}
.qp-q1.active{border-color:#f85149;color:#f85149;background:#f8514912}
.qp-q2.active{border-color:#58a6ff;color:#58a6ff;background:#58a6ff12}
.qp-q3.active{border-color:#d29922;color:#d29922;background:#d2992212}
.qp-q4.active{border-color:#8b949e;color:#c9d1d9;background:#8b949e12}

/* Matrix progress badges */
.mc-status{margin-top:6px;display:flex;align-items:center;gap:6px}
.mc-progress-badge{font-size:.6rem;padding:2px 8px;border-radius:4px;font-weight:600;letter-spacing:.3px;cursor:pointer;transition:all .2s;user-select:none}
.mc-progress-badge:hover{transform:scale(1.05);filter:brightness(1.2)}
.mc-prog-not-started{background:#8b949e20;color:#8b949e}
.mc-prog-in-progress{background:#58a6ff20;color:#58a6ff}
.mc-prog-blocked{background:#d2992220;color:#d29922}

/* Matrix card block reason */
.mc-block-input{width:100%;margin-top:4px;padding:4px 8px;background:#0d1117;border:1px solid #d29922;border-radius:4px;color:#d29922;font-size:.68rem;outline:none}
.mc-block-input::placeholder{color:#d2992266}

/* Matrix card actions */
.mc-actions{position:absolute;top:8px;right:24px;display:flex;gap:2px;opacity:0;transition:opacity .2s}
.matrix-card:hover .mc-actions,.matrix-card:focus-within .mc-actions,.kanban-card:hover .mc-actions,.kanban-card:focus-within .mc-actions{opacity:1}
.mc-act-btn{background:none;border:none;color:#8b949e;cursor:pointer;font-size:.72rem;padding:2px 5px;border-radius:4px;transition:all .15s}
.mc-act-btn:hover{background:#21262d;color:#c9d1d9}
.mc-act-btn.mc-done-btn:hover{color:#3fb950}
.mc-act-btn.mc-del-btn:hover{color:#f85149}

/* Matrix empty quadrant */
.mq-empty{text-align:center;padding:24px 12px;color:#484f58;font-size:.75rem;font-style:italic}

/* Matrix compact mode */
.matrix-card.mc-compact{padding:6px 10px;margin-bottom:4px}
.mc-compact .mc-task{font-size:.72rem;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-compact .mc-meta,.mc-compact .mc-status{display:none}
.mc-compact .mc-project{margin-bottom:2px}
.mc-compact .mc-project .project-badge{font-size:.58rem;padding:1px 5px}
.mq-show-toggle{text-align:center;margin-top:4px}
.mq-show-toggle button{background:none;border:none;color:#58a6ff;font-size:.65rem;cursor:pointer;padding:2px 8px}
.mq-show-toggle button:hover{text-decoration:underline}

/* Auto-done timeline entries */
.timeline-entry.auto-done{border-left-color:#3fb950}
.timeline-entry.auto-done .entry-text{color:#3fb950}

/* Activity log */
.activity-container{display:none;animation:slideDown .3s ease}
.activity-container.open{display:block}
.activity-feed{display:flex;flex-direction:column;gap:10px}
.activity-entry{display:flex;gap:12px;padding:12px 16px;background:#161b22;border:1px solid #30363d;border-radius:10px;align-items:center;font-size:.82rem}
.activity-entry .ae-icon{font-size:1.1rem;min-width:24px;text-align:center}
.activity-entry .ae-text{flex:1;color:#c9d1d9;line-height:1.4}
.activity-entry .ae-text .ae-task{font-weight:600;color:#58a6ff}
.activity-entry .ae-text .ae-project{color:#a371f7}
.activity-entry .ae-time{font-size:.7rem;color:#8b949e;min-width:80px;text-align:right}
.activity-entry .ae-arrow{color:#8b949e;margin:0 4px}
.activity-entry .ae-from{color:#8b949e;text-decoration:line-through}
.activity-entry .ae-to{font-weight:600}
.ae-to.to-done{color:#3fb950}
.ae-to.to-in-progress{color:#58a6ff}
.ae-to.to-blocked{color:#d29922}
.ae-to.to-not-started{color:#8b949e}

/* Shortcut hint */
.shortcut-hint{font-size:.65rem;color:#484f58;margin-top:8px;padding:4px 8px;border-left:2px solid #30363d}

/* === NEW NAV LAYOUT === */
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:8px 0}
.segmented-control{display:flex;background:#21262d;border:1px solid #30363d;border-radius:8px;overflow:hidden}
.seg-btn{background:transparent;border:none;color:#8b949e;padding:7px 16px;font-size:.78rem;cursor:pointer;transition:all .2s;font-weight:500}
.seg-btn:hover{color:#c9d1d9}
.seg-btn.active{background:#58a6ff22;color:#58a6ff;font-weight:600}

.search-collapsible{position:relative;display:flex;align-items:center}
.search-icon-btn{background:none;border:1px solid #30363d;color:#8b949e;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.search-icon-btn:hover{border-color:#58a6ff;color:#58a6ff}
.search-icon-btn.expanded{border-color:#58a6ff;color:#58a6ff;border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
.search-expand-input{width:0;opacity:0;padding:0;border:1px solid #30363d;border-left:none;background:#0d1117;color:#c9d1d9;font-size:.8rem;border-radius:0 8px 8px 0;height:34px;transition:width .25s ease,opacity .25s ease,padding .25s ease;outline:none}
.search-expand-input.open{width:220px;opacity:1;padding:0 12px}
.search-expand-input:focus{border-color:#58a6ff}

.overflow-wrap{position:relative}
.overflow-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s;letter-spacing:-1px}
.overflow-btn:hover{border-color:#58a6ff;color:#58a6ff}
.overflow-dropdown{display:none;position:absolute;top:calc(100% + 6px);right:0;background:#161b22;border:1px solid #30363d;border-radius:10px;padding:6px;min-width:160px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:500;animation:slideDown .2s ease}
.overflow-dropdown.open{display:block}
.overflow-dropdown button{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:#c9d1d9;padding:8px 12px;border-radius:6px;font-size:.8rem;cursor:pointer;transition:background .15s}
.overflow-dropdown button:hover{background:#21262d}
.overflow-dropdown button .od-icon{font-size:.9rem;min-width:18px;text-align:center}

.view-tabs{display:flex;gap:6px;margin-bottom:12px;padding:6px 0;border-bottom:1px solid #21262d}
.view-tab{background:transparent;border:none;border-left:2px solid transparent;color:#8b949e;padding:5px 14px;font-size:.78rem;cursor:pointer;transition:all .2s;border-radius:0 6px 6px 0}
.view-tab:hover{color:#c9d1d9;background:#21262d}
.view-tab.active{color:#58a6ff;border-left-color:#58a6ff;background:#58a6ff11}

.project-tabs-row{display:flex;gap:6px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
.proj-tab{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.proj-tab:hover{border-color:#a371f7;color:#a371f7}
.proj-tab.active{background:#a371f722;border-color:#a371f7;color:#a371f7}
.proj-tab[draggable]{cursor:grab}
.proj-add-btn{background:transparent;border:1px dashed #3fb950;color:#3fb950;padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.78rem;transition:all .2s}
.proj-add-btn:hover{background:#3fb95011}

.filter-bar{display:flex;gap:6px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.filter-pill{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.72rem;transition:all .2s;white-space:nowrap}
.filter-pill:hover{border-color:#58a6ff;color:#58a6ff}
.filter-pill.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.filter-pill.add-ai{border-color:#3fb950;color:#3fb950}
.filter-pill.add-ai:hover{background:#3fb95022}

@media(max-width:768px){
.top-bar{flex-wrap:wrap;gap:8px;padding:4px 0}
.search-expand-input.open{width:160px}
.filter-bar{gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.filter-bar::-webkit-scrollbar{display:none}

.project-tabs-row{gap:6px;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.project-tabs-row::-webkit-scrollbar{display:none}
.proj-tab{padding:8px 14px;font-size:.75rem;min-height:44px;display:inline-flex;align-items:center;flex-shrink:0}
.view-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px}
.view-tabs::-webkit-scrollbar{display:none}
.view-tab{min-height:44px;padding:8px 16px;flex-shrink:0;display:inline-flex;align-items:center}
.seg-btn{min-height:44px;padding:8px 14px}
.search-icon-btn{width:44px;height:44px}
.overflow-btn{width:44px;height:44px}
.btn{min-height:44px;display:inline-flex;align-items:center}
.add-form{position:fixed;bottom:0;left:0;right:0;top:auto;z-index:900;border-radius:20px 20px 0 0;margin-bottom:0;max-height:85vh;overflow-y:auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:slideUpForm .3s ease}
@keyframes slideUpForm{from{transform:translateY(100%)}to{transform:translateY(0)}}
.add-form::after{content:'';display:block;width:40px;height:4px;background:#484f58;border-radius:2px;margin:0 auto 12px;position:sticky;top:0}
.kanban-board{grid-template-columns:repeat(3,82vw)!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:8px;gap:10px}
.kanban-board::-webkit-scrollbar{display:none}
.kanban-col{scroll-snap-align:start;min-width:82vw;min-height:200px;padding:10px;border-radius:14px}
.kanban-card{padding:14px;border-radius:12px;margin-bottom:12px}
.kanban-card .kc-task{font-size:.88rem;margin-bottom:10px}

<body>
<script>if((localStorage.getItem("ai_tracker_theme")||"light")==="light")document.body.classList.add("light")</script>
<p class="subtitle" style="margin-top:8px">Last updated: <span id="lastUpdate"></span></p>
<div class="summary" id="summary"></div>

<!-- Top Bar: Segmented Control + Search + Overflow -->
<div class="top-bar">
  <div class="segmented-control">
    <button class="seg-btn active" id="segTable">Table</button>
    <button class="seg-btn" id="segBoard">Board</button>
    <button class="seg-btn" id="segMatrix">Matrix</button>
  </div>
  <div class="search-collapsible">
    <button class="search-icon-btn" id="searchToggleBtn" title="Search">&#128269;</button>
    <input type="text" class="search-expand-input" id="searchInput" placeholder="Search tasks...">
  </div>
  <div class="overflow-wrap">
    <button class="overflow-btn" id="overflowBtn" title="More actions">&#8943;</button>
    <div class="overflow-dropdown" id="overflowDropdown">
      <button id="toggleTheme"><span class="od-icon">&#9790;</span>Toggle Theme</button>
    </div>
  </div>
</div>

<!-- View Tabs (secondary nav) -->
<div class="view-tabs" id="viewTabs">
  <button class="view-tab active" data-view="all">All</button>
  <button class="view-tab" data-view="__updates__">Updates</button>
  <button class="view-tab" data-view="__wins__">Completed</button>
  <button class="view-tab" data-view="__activity__">Activity</button>
</div>

<!-- Project Tabs -->
<div class="project-tabs-row" id="projectTabsRow">
  <button class="proj-add-btn" id="addProjectBtn">+</button>
</div>

<!-- Filter Bar -->
<div class="filter-bar" id="filterBar">
  <button class="filter-pill add-ai" id="addBtn">+ Add AI</button>
  <button class="filter-pill" id="toggleWeek">This Week</button>
</div>

<!-- Hidden legacy elements for JS compat -->
<div id="tabs" style="display:none"><button class="tab active" data-filter="all">All</button></div>
<button id="toggleBoard" style="display:none"></button>
<div class="form-backdrop" id="formBackdrop"></div>
<div class="add-form" id="addForm">
  <div class="form-grid">
    <div class="form-group"><label>Project</label><select id="f-project"></select></div>
    <div class="form-group"><label>Task</label><input type="text" id="f-task" placeholder="What needs to be done?"></div>
    <div class="form-group"><label>Due Date</label><input type="date" id="f-due"></div>
    <div class="form-group"><label>Placement</label><div class="quadrant-picker" id="f-quadrant"><button type="button" class="qp-btn qp-q1 active" data-q="q1">🔥 Do First</button><button type="button" class="qp-btn qp-q2" data-q="q2">📅 Schedule</button><button type="button" class="qp-btn qp-q3" data-q="q3">📤 Delegate</button><button type="button" class="qp-btn qp-q4" data-q="q4">🗑️ Eliminate</button></div></div>
    <div class="form-group"><label>Source</label><input type="text" id="f-source" placeholder="Meeting, email, etc."></div>
  </div>
  <div class="form-group" style="margin-top:12px"><label>Notes (optional)</label><textarea id="f-notes" placeholder="Additional details..."></textarea></div>
  <div class="form-actions"><button class="btn-submit" id="submitBtn">Add Action Item</button></div>
  <div class="shortcut-hint">Shortcuts: Ctrl+N to open form | Ctrl+Enter to submit</div>
</div>
<div class="modal-overlay" id="projectModal">
  <div class="modal-content">
    <h3>Add New Project</h3>
    <div class="form-group"><label>Project Name</label><input type="text" id="new-project-name" placeholder="e.g. QP40 LT9999"></div>
    <div style="margin-top:16px;display:flex;gap:12px">
      <button class="btn-submit" id="submitProject">Create</button>
      <button class="btn" id="cancelProject">Cancel</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="editModal">
  <div class="modal-content" style="min-width:400px">
    <h3>Edit Task</h3>
    <input type="hidden" id="edit-id">
    <div class="form-grid">
      <div class="form-group"><label>Project</label><select id="edit-project"></select></div>

<script>
function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function safeParseJSON(str,fallback){try{return JSON.parse(str)}catch(e){return fallback}}
var _syncTimer=null;
function debouncedSync(){if(_syncTimer)clearTimeout(_syncTimer);_syncTimer=setTimeout(function(){_syncTimer=null;syncToCloud()},2000)}
function uniqueId(){return Date.now()*1000+Math.floor(Math.random()*1000)}
function normalizeToDay(dateStr){var parts=dateStr.split("-");return new Date(+parts[0],+parts[1]-1,+parts[2])}
function todayNormalized(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}

function formatRelativeDate(dateStr){
  if(!dateStr)return"-";
  var due=normalizeToDay(dateStr);var today=todayNormalized();
  var diffMs=due-today;var diffDays=Math.round(diffMs/(1000*60*60*24));
  if(diffDays===0)return"Today";
  if(diffDays===1)return"Tomorrow";
  if(diffDays===-1)return"1d overdue";
  if(diffDays<-7)return Math.abs(Math.floor(diffDays/7))+"w overdue";
  if(diffDays<0)return Math.abs(diffDays)+"d overdue";
  if(diffDays<=6)return"in "+diffDays+"d";
  return dateStr;
}
function isThisWeekItem(item){
  if(!item.dueDate&&item.progress!=="done"){return false}
  if(item.progress==="done")return false;
  var today=todayNormalized();
  var day=today.getDay();var diffMon=day===0?-6:1-day;
  var monday=new Date(today);monday.setDate(today.getDate()+diffMon);
  var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);
  if(item.dueDate){
    var due=normalizeToDay(item.dueDate);
    if(due<today)return true;
    if(due>=monday&&due<=sunday)return true;
  }
  return false;
}
function isArchivedItem(item){
  if(item.progress!=="done"||!item.completedAt)return false;
  var completedDate=new Date(item.completedAt);
  var diffMs=todayNormalized()-completedDate;
  var diffDays=diffMs/(1000*60*60*24);
  return diffDays>ARCHIVE_DAYS;
}
function loadActivity(){
  var stored=localStorage.getItem(ACTIVITY_KEY);
  if(stored){var arr=safeParseJSON(stored,[]);if(!Array.isArray(arr))arr=[];return arr}
  return[];
}
function saveActivity(log){
  if(log.length>200)log=log.slice(log.length-200);
  localStorage.setItem(ACTIVITY_KEY,JSON.stringify(log));
}
function logActivity(itemId,task,project,fromStatus,toStatus){
  var log=loadActivity();
  log.push({id:uniqueId(),itemId:itemId,task:task,project:project,from:fromStatus,to:toStatus,timestamp:new Date().toISOString()});
  saveActivity(log);
}
function formatRelativeTime(isoStr){
  var then=new Date(isoStr);var now=new Date();
  var diffMs=now-then;var diffMin=Math.floor(diffMs/60000);
  if(diffMin<1)return"just now";
  if(diffMin<60)return diffMin+"m ago";
  var diffHr=Math.floor(diffMin/60);
  if(diffHr<24)return diffHr+"h ago";
  var diffDay=Math.floor(diffHr/24);
  if(diffDay<7)return diffDay+"d ago";
  return then.toLocaleDateString("en-US",{month:"short",day:"numeric"});
}
function renderKanban(){
  var filtered=items.filter(function(i){return currentFilter==="all"||i.project===currentFilter});
  if(searchQuery){var q=searchQuery.toLowerCase();filtered=filtered.filter(function(i){return(i.task||"").toLowerCase().indexOf(q)!==-1||(i.project||"").toLowerCase().indexOf(q)!==-1||(i.source||"").toLowerCase().indexOf(q)!==-1||(i.notes||"").toLowerCase().indexOf(q)!==-1})}
  filtered=filtered.filter(function(i){return i.progress!=="done"});
  if(thisWeekMode)filtered=filtered.filter(isThisWeekItem);
  var cols={"not-started":[],"in-progress":[],"blocked":[]};
  filtered.forEach(function(i){if(cols[i.progress])cols[i.progress].push(i)});
  var html="";
  BOARD_STAGES.forEach(function(stage){
    html+='<div class="kanban-col" data-stage="'+stage+'"><div class="kanban-col-header kh-'+stage+'">'+STAGE_LABELS[stage]+' ('+cols[stage].length+')</div>';
    cols[stage].forEach(function(i){
      var pDot=i.priority==="High"?"background:var(--c-red)":i.priority==="Low"?"background:var(--c-muted)":"background:var(--c-blocked)";
      var dueText=formatRelativeDate(i.dueDate);
      var dueClass=getDueClass(i);
      html+='<div class="kanban-card" draggable="true" data-id="'+i.id+'">';
      html+='<div class="kc-priority" style="'+pDot+'"></div>';
      html+='<div class="mc-actions">'+actGroupHtml(i)+'</div>';
      html+='<div class="kc-project"><span class="project-badge">'+esc(i.project)+'</span></div>';
      html+='<div class="kc-task">'+esc(i.task)+'</div>';
      html+='<div class="kc-meta"><span class="kc-due '+dueClass+'" title="'+(i.dueDate||"")+'">'+dueText+'</span>'+getSubtaskCountHtml(i.id)+'</div>';
      if(expandedSubtasks[i.id]&&getSubtasksForItem(i.id).length)html+=subChecklistHtml(i,"board");
      html+='</div>';
    });
    html+='</div>';
  });
  document.getElementById("kanbanBoard").innerHTML=html;
  // Drag and drop between columns
  var board=document.getElementById("kanbanBoard");
  var dragCardId=null;
  board.querySelectorAll(".kanban-card").forEach(function(card){
    card.addEventListener("dragstart",function(){dragCardId=+card.dataset.id;card.classList.add("dragging")});
    card.addEventListener("dragend",function(){card.classList.remove("dragging");dragCardId=null});
  });
  board.querySelectorAll(".kanban-col").forEach(function(col){
    col.addEventListener("dragover",function(e){e.preventDefault();col.classList.add("drag-over")});
    col.addEventListener("dragleave",function(){col.classList.remove("drag-over")});
    col.addEventListener("drop",function(e){
      e.preventDefault();col.classList.remove("drag-over");
      if(dragCardId===null)return;
      var targetStage=col.dataset.stage;
      var item=items.find(function(i){return i.id===dragCardId});
      if(!item||item.progress===targetStage)return;
      pushUndo();
      var fromStage=item.progress;
      item.progress=targetStage;
      item.completedAt=null;
      if(targetStage!=="blocked")item.blockReason="";
      logActivity(item.id,item.task,item.project,fromStage,targetStage);
      saveItems();renderKanban();
    });
  });
  // Touch drag-and-drop for mobile kanban (long-press to activate)
  (function(){
    var touchDragCard=null,touchDragId=null,touchClone=null,touchStartX=0,touchStartY=0,touchMoved=false;
    var longPressTimer=null,longPressActive=false;
    var LONG_PRESS_MS=400;
    board.querySelectorAll(".kanban-card").forEach(function(card){
      card.addEventListener("touchstart",function(e){
        if(e.touches.length!==1)return;
        touchDragCard=card;touchDragId=+card.dataset.id;
        touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
        touchMoved=false;longPressActive=false;
        longPressTimer=setTimeout(function(){
          longPressActive=true;
          card.style.transform="scale(1.05)";card.style.boxShadow="0 8px 24px rgba(88,166,255,.3)";
          if(navigator.vibrate)navigator.vibrate(30);
        },LONG_PRESS_MS);
      },{passive:true});
    });
    board.addEventListener("touchmove",function(e){
      if(!touchDragCard)return;
      var dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;
      if(!longPressActive){
        if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(longPressTimer);longPressTimer=null;touchDragCard=null;touchDragId=null}
        return;
      }
      if(!touchMoved){
        touchMoved=true;
        touchClone=touchDragCard.cloneNode(true);
        touchClone.style.cssText="position:fixed;z-index:9999;width:"+touchDragCard.offsetWidth+"px;opacity:.85;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 40px rgba(0,0,0,.5);transition:none";
        document.body.appendChild(touchClone);
        touchDragCard.style.opacity="0.3";touchDragCard.style.transform="";touchDragCard.style.boxShadow="";
        board.style.overflowX="hidden";
      }
      e.preventDefault();
      touchClone.style.left=(e.touches[0].clientX-touchDragCard.offsetWidth/2)+"px";
      touchClone.style.top=(e.touches[0].clientY-30)+"px";
      board.querySelectorAll(".kanban-col").forEach(function(c){c.classList.remove("drag-over")});
      var el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
      if(el){var col=el.closest(".kanban-col");if(col)col.classList.add("drag-over")}
    },{passive:false});
    board.addEventListener("touchend",function(e){
      clearTimeout(longPressTimer);longPressTimer=null;
      if(!touchDragCard){longPressActive=false;return}
      if(touchClone){document.body.removeChild(touchClone);touchClone=null}
      touchDragCard.style.opacity="1";touchDragCard.style.transform="";touchDragCard.style.boxShadow="";
      board.style.overflowX="";
      board.querySelectorAll(".kanban-col").forEach(function(c){c.classList.remove("drag-over")});
      if(touchMoved&&longPressActive){
        var touch=e.changedTouches[0];
        var el=document.elementFromPoint(touch.clientX,touch.clientY);
        if(el){
          var col=el.closest(".kanban-col");
          if(col&&touchDragId!==null){
            var targetStage=col.dataset.stage;
            var item=items.find(function(i){return i.id===touchDragId});
            if(item&&item.progress!==targetStage){
              pushUndo();
              var fromStage=item.progress;
              item.progress=targetStage;
              item.completedAt=null;
              if(targetStage!=="blocked")item.blockReason="";
              logActivity(item.id,item.task,item.project,fromStage,targetStage);
              saveItems();renderKanban();
            }
          }
        }
      }
      touchDragCard=null;touchDragId=null;touchMoved=false;longPressActive=false;
    });
    board.addEventListener("touchcancel",function(){
      clearTimeout(longPressTimer);longPressTimer=null;
      if(touchClone){document.body.removeChild(touchClone);touchClone=null}
      if(touchDragCard){touchDragCard.style.opacity="1";touchDragCard.style.transform="";touchDragCard.style.boxShadow=""}
      board.style.overflowX="";
      board.querySelectorAll(".kanban-col").forEach(function(c){c.classList.remove("drag-over")});
      touchDragCard=null;touchDragId=null;touchMoved=false;longPressActive=false;
    });
  })();
  applyLayout();
}
function renderActivity(){
  var log=loadActivity();
  log.sort(function(a,b){return b.timestamp.localeCompare(a.timestamp)});
  var html="";
  if(!log.length){html='<div class="timeline-empty">No activity yet. Status changes will appear here.</div>'}
  else{
    log.forEach(function(entry){
      var icon=entry.to==="done"?"&#10003;":entry.to==="created"?"&#43;":entry.to==="deleted"?"&#128465;":"&#8634;";
      var toClass="ae-to to-"+(entry.to||"not-started");
      html+='<div class="activity-entry">';
      html+='<span class="ae-icon">'+icon+'</span>';
      html+='<span class="ae-text">';
      html+='<span class="ae-task">'+esc(entry.task)+'</span>';
      html+=' <span class="ae-project">['+esc(entry.project)+']</span> ';
      if(entry.to==="created"){html+='<span class="ae-to to-not-started">created</span>'}
      else if(entry.to==="deleted"){html+='<span class="ae-to to-blocked">deleted</span>'}
      else{html+='<span class="ae-from">'+STAGE_LABELS[entry.from||"not-started"]+'</span><span class="ae-arrow"> &rarr; </span><span class="'+toClass+'">'+STAGE_LABELS[entry.to]+'</span>'}
      html+='</span>';
      html+='<span class="ae-time">'+formatRelativeTime(entry.timestamp)+'</span>';
      html+='</div>';
    });
  }
  document.getElementById("activityFeed").innerHTML=html;
}
var SEG_IDS={table:"segTable",board:"segBoard",matrix:"segMatrix"};
function getViewTab(){return(typeof currentFilter==="string"&&currentFilter.indexOf("__")===0)?currentFilter:"all"}
function applyLayout(){
  var tab=getViewTab(),main=tab==="all",m=viewMode;
  var showTable=main&&m==="table";
  document.querySelector(".table-wrap").style.display=showTable?"":"none";
  document.getElementById("mobileCards").classList.toggle("hidden",!showTable);
  document.getElementById("empty").style.display=showTable&&tableRowCount===0?"block":"none";
  document.getElementById("kanbanContainer").classList.toggle("open",main&&m==="board");
  document.getElementById("matrixContainer").classList.toggle("open",main&&m==="matrix");
  document.getElementById("updatesContainer").classList.toggle("open",tab==="__updates__");
  document.getElementById("winsContainer").classList.toggle("open",tab==="__wins__");
  document.getElementById("activityContainer").classList.toggle("open",tab==="__activity__");
  Object.keys(SEG_IDS).forEach(function(k){document.getElementById(SEG_IDS[k]).classList.toggle("active",m===k)});
  document.getElementById("filterBar").style.display=main?"":"none";
  document.getElementById("projectTabsRow").style.display=main?"":"none";
  document.querySelector(".summary").style.display=main?"":"none";
  if(!main)closeAddForm();
  activateViewTab(tab);
}
function setViewMode(mode){
  viewMode=mode;
  if(getViewTab()!=="all"){currentFilter="all";renderProjectTabs()}
  refreshView();
}
function refreshView(){
  var tab=getViewTab();
  if(tab==="__updates__")renderUpdates();
  else if(tab==="__wins__")renderWins();
  else if(tab==="__activity__")renderActivity();
  else if(viewMode==="matrix")renderMatrix();
  else if(viewMode==="board")renderKanban();
  else render();
  applyLayout();
}
function setSelectValue(sel,val,addMissing){
  if(!sel||!val)return false;
  var has=Array.prototype.some.call(sel.options,function(o){return o.value===val});
  if(!has){if(!addMissing)return false;var o=document.createElement("option");o.value=val;o.textContent=val;sel.appendChild(o)}
  sel.value=val;return true;
}
function openAddForm(opts){
  opts=opts||{};
  var form=document.getElementById("addForm");
  form.classList.add("open");document.getElementById("formBackdrop").classList.add("open");
  if(currentFilter&&currentFilter!=="all"&&currentFilter.indexOf("__")!==0)setSelectValue(document.getElementById("f-project"),currentFilter,true);
  if(opts.quadrant)document.querySelectorAll("#f-quadrant .qp-btn").forEach(function(b){b.classList.toggle("active",b.dataset.q===opts.quadrant)});
  if(opts.scroll&&form.scrollIntoView)form.scrollIntoView({behavior:"smooth",block:"start"});
  if(opts.focus)setTimeout(function(){document.getElementById("f-task").focus()},100);
}
function closeAddForm(){document.getElementById("addForm").classList.remove("open");document.getElementById("formBackdrop").classList.remove("open")}
function getSelectedQuadrant(pickerId){
  var active=document.querySelector("#"+pickerId+" .qp-btn.active");
  return active?active.dataset.q:"q1";
}
function quadrantToProps(q){
  var isImportant=(q==="q1"||q==="q2");
  var isUrgent=(q==="q1"||q==="q3");
  var priority=isImportant?"High":(q==="q4"?"Low":"Med");
  return{priority:priority,urgent:isUrgent};
}
function logDoneToUpdates(item){
  updates.push({id:uniqueId(),project:item.project,date:new Date().toISOString().split("T")[0],text:"\u2705 Completed: "+item.task,type:"auto-done"});
  saveUpdates();
}
function getTaskQuadrant(item){
  var dominated=item.priority==="High";
  var urgent=false;
  if(item.dueDate){
    var due=normalizeToDay(item.dueDate);var today=todayNormalized();
    var diffDays=Math.round((due-today)/(1000*60*60*24));
    if(diffDays<=3)urgent=true;
  }
  if(urgent&&dominated)return"q1";
  if(!urgent&&dominated)return"q2";
  if(urgent&&!dominated)return"q3";
  return"q4";
}
var matrixExpanded={};
function renderMatrix(){
  var filtered=items.filter(function(i){return i.progress!=="done"});
  filtered=filtered.filter(function(i){return currentFilter==="all"||i.project===currentFilter});
  if(searchQuery){var q=searchQuery.toLowerCase();filtered=filtered.filter(function(i){return(i.task||"").toLowerCase().indexOf(q)!==-1||(i.project||"").toLowerCase().indexOf(q)!==-1})}
  filtered=filtered.filter(function(i){return!isArchivedItem(i)});
  if(thisWeekMode)filtered=filtered.filter(isThisWeekItem);
  var buckets={q1:[],q2:[],q3:[],q4:[]};
  filtered.forEach(function(i){buckets[getTaskQuadrant(i)].push(i)});
  ["q1","q2","q3","q4"].forEach(function(qid){buckets[qid].sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)})});
  var labels={q1:{icon:"\u{1F525}",title:"DO FIRST",color:"var(--c-red)"},q2:{icon:"\u{1F4C5}",title:"SCHEDULE",color:"var(--c-prog)"},q3:{icon:"\u{1F4E4}",title:"DELEGATE",color:"var(--c-blocked)"},q4:{icon:"\u{1F5D1}",title:"ELIMINATE",color:"var(--c-ns)"}};
  var COMPACT_LIMIT=6;
  ["q1","q2","q3","q4"].forEach(function(qid){
    var el=document.querySelector('.matrix-quadrant[data-quadrant="'+qid+'"]');
    var lab=labels[qid];
    var html='<div class="mq-header"><span class="mq-icon">'+lab.icon+'</span><span class="mq-title">'+lab.title+'</span><span class="mq-count">'+buckets[qid].length+'</span><button type="button" class="mq-add-btn" data-addq="'+qid+'" title="Add to '+lab.title+'" aria-label="Add action item to '+lab.title+'">+</button></div>';
    html+='<div class="matrix-row-label">'+lab.title+'</div>';
    if(!buckets[qid].length){
      html+='<div class="mq-empty">No items</div>';
    }else{
      var useCompact=buckets[qid].length>COMPACT_LIMIT&&!matrixExpanded[qid];
      buckets[qid].forEach(function(i,idx){
        var compact=useCompact&&idx>=COMPACT_LIMIT;
        var pDot=i.priority==="High"?"background:var(--c-red)":i.priority==="Low"?"background:var(--c-muted)":"background:var(--c-blocked)";
        var dueText=formatRelativeDate(i.dueDate);
        var dueClass=getDueClass(i);
        var progLabel=STAGE_LABELS[i.progress]||i.progress;
        var blockTitle=i.progress==="blocked"&&i.blockReason?' title="'+esc(i.blockReason).replace(/"/g,"&quot;")+'"':"";
        html+='<div class="matrix-card'+(compact?" mc-compact":"")+'" draggable="true" data-id="'+i.id+'"'+(compact?' style="display:none"':"")+' data-idx="'+idx+'">';
        html+='<div class="mc-priority" style="'+pDot+'"></div>';
        html+='<div class="mc-actions">'+actGroupHtml(i)+'</div>';
        html+='<div class="mc-project"><span class="project-badge">'+esc(i.project)+'</span></div>';
        html+='<div class="mc-task">'+esc(i.task)+'</div>';
        html+='<div class="mc-meta"><span class="mc-due '+dueClass+'" title="'+(i.dueDate||"")+'">'+dueText+'</span>'+getSubtaskCountHtml(i.id)+'</div>';
        html+='<div class="mc-status"><span class="mc-progress-badge mc-prog-'+i.progress+'" data-cyc="'+i.id+'"'+blockTitle+'>'+progLabel+'</span></div>';
        if(i.progress==="blocked"){html+='<input class="mc-block-input" data-block-id="'+i.id+'" placeholder="Block reason..." value="'+esc(i.blockReason||"").replace(/"/g,"&quot;")+'">';}
        if(expandedSubtasks[i.id]&&getSubtasksForItem(i.id).length)html+=subChecklistHtml(i,"matrix");
        html+='</div>';
      });
      if(useCompact){
        var extra=buckets[qid].length-COMPACT_LIMIT;
        html+='<div class="mq-show-toggle"><button data-expand="'+qid+'">Show '+extra+' more</button></div>';
      }
      if(matrixExpanded[qid]&&buckets[qid].length>COMPACT_LIMIT){
        html+='<div class="mq-show-toggle"><button data-collapse="'+qid+'">Show less</button></div>';
      }
    }
    el.innerHTML=html;
  });
  document.querySelectorAll(".mq-add-btn").forEach(function(btn){
    btn.addEventListener("click",function(e){e.stopPropagation();openAddForm({quadrant:btn.dataset.addq,focus:true,scroll:true})});
  });
  document.querySelectorAll("[data-expand]").forEach(function(btn){
    btn.addEventListener("click",function(){matrixExpanded[btn.dataset.expand]=true;renderMatrix()});
  });
  document.querySelectorAll("[data-collapse]").forEach(function(btn){

function matrixCycleProgress(id){

  var idx=matrixStages.indexOf(item.progress);
  item.progress=matrixStages[(idx+1)%matrixStages.length];
  if(item.progress!=="blocked")item.blockReason="";
  logActivity(item.id,item.task,item.project,oldProgress,item.progress);
  saveItems();renderMatrix();

}

function initMatrixTouch(){
  var container=document.getElementById("matrixContainer");
  if(!container)return;

  var lpTimer=null,lpActive=false,LP_MS=400;
  container.querySelectorAll(".matrix-card").forEach(function(card){
    card.addEventListener("touchstart",function(e){
      if(e.touches.length!==1)return;
      touchCard=card;touchId=+card.dataset.id;
      touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;
      touchMoved=false;lpActive=false;
      lpTimer=setTimeout(function(){
        lpActive=true;
        card.style.transform="scale(1.05)";card.style.boxShadow="0 8px 24px rgba(88,166,255,.3)";
        if(navigator.vibrate)navigator.vibrate(30);
      },LP_MS);
    },{passive:true});
  });
  container.addEventListener("touchmove",function(e){
    if(!touchCard)return;
    var dx=e.touches[0].clientX-touchStartX,dy=e.touches[0].clientY-touchStartY;
    if(!lpActive){
      if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(lpTimer);lpTimer=null;touchCard=null;touchId=null}
      return;
    }
    if(!touchMoved){
      touchMoved=true;
      touchClone=touchCard.cloneNode(true);
      touchClone.style.cssText="position:fixed;z-index:9999;width:"+touchCard.offsetWidth+"px;opacity:.85;pointer-events:none;transform:rotate(2deg);box-shadow:0 12px 40px rgba(0,0,0,.5);transition:none";
      document.body.appendChild(touchClone);
      touchCard.style.opacity="0.3";touchCard.style.transform="";touchCard.style.boxShadow="";
    }
    e.preventDefault();
    touchClone.style.left=(e.touches[0].clientX-touchCard.offsetWidth/2)+"px";
    touchClone.style.top=(e.touches[0].clientY-30)+"px";
    container.querySelectorAll(".matrix-quadrant").forEach(function(c){c.classList.remove("drag-over")});
    var el=document.elementFromPoint(e.touches[0].clientX,e.touches[0].clientY);
    if(el){var q=el.closest(".matrix-quadrant");if(q)q.classList.add("drag-over")}
  },{passive:false});
  container.addEventListener("touchend",function(e){
    clearTimeout(lpTimer);lpTimer=null;
    if(!touchCard){lpActive=false;return}
    if(touchClone){document.body.removeChild(touchClone);touchClone=null}
    touchCard.style.opacity="1";touchCard.style.transform="";touchCard.style.boxShadow="";
    container.querySelectorAll(".matrix-quadrant").forEach(function(c){c.classList.remove("drag-over")});
    if(touchMoved&&lpActive){
      var touch=e.changedTouches[0];
      var el=document.elementFromPoint(touch.clientX,touch.clientY);
      if(el){
        var quad=el.closest(".matrix-quadrant");
        if(quad&&touchId!==null){
          var targetQ=quad.dataset.quadrant;
          var item=items.find(function(i){return i.id===touchId});
          if(item){
            var currentQ=getTaskQuadrant(item);
            if(currentQ!==targetQ){
              pushUndo();
              var isImportant=(targetQ==="q1"||targetQ==="q2");
              var isUrgent=(targetQ==="q1"||targetQ==="q3");
              item.priority=isImportant?"High":(targetQ==="q4"?"Low":"Med");
              if(isUrgent){
                var today=todayNormalized();var soon=new Date(today);soon.setDate(today.getDate()+1);
                if(!item.dueDate||normalizeToDay(item.dueDate)>new Date(todayNormalized().getTime()+3*86400000)){
                  item.dueDate=soon.getFullYear()+"-"+String(soon.getMonth()+1).padStart(2,"0")+"-"+String(soon.getDate()).padStart(2,"0");
                }
              }else if(item.dueDate){
                var due=normalizeToDay(item.dueDate);var today2=todayNormalized();
                var diffDays=Math.round((due-today2)/(1000*60*60*24));
                if(diffDays<=3){var future=new Date(today2);future.setDate(today2.getDate()+7);item.dueDate=future.getFullYear()+"-"+String(future.getMonth()+1).padStart(2,"0")+"-"+String(future.getDate()).padStart(2,"0")}
              }
              logActivity(item.id,item.task,item.project,currentQ,targetQ);
              saveItems();renderMatrix();
            }
          }
        }
      }
    }
    touchCard=null;touchId=null;touchMoved=false;lpActive=false;
  });
  container.addEventListener("touchcancel",function(){
    clearTimeout(lpTimer);lpTimer=null;
    if(touchClone){document.body.removeChild(touchClone);touchClone=null}
    if(touchCard){touchCard.style.opacity="1";touchCard.style.transform="";touchCard.style.boxShadow=""}
    container.querySelectorAll(".matrix-quadrant").forEach(function(c){c.classList.remove("drag-over")});
    touchCard=null;touchId=null;touchMoved=false;lpActive=false;
  });
}

// === Google Sheets Sync ===
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJ8wrYPiJYVxD15I_XX0b_tMHUUe4iMIA3eAdgLv5Q9lGqyOc1TKYPx78VvYKAZ900SA/exec";
var syncInProgress = false;

function fixDate(d) {
  if (!d) return "";
  if (typeof d === "string" && d.indexOf("T") > -1) return d.split("T")[0];
  return String(d);
}

function syncToCloud() {
  if (syncInProgress) return;
  syncInProgress = true;
  var itemsForCloud = items.map(function(i){var c=JSON.parse(JSON.stringify(i));c.subtasksJson=JSON.stringify(c.subtasks||[]);delete c.subtasks;return c});
  var payload = {action: "save", app: "ai", data: {items: itemsForCloud, updates: updates, projects: projects}};
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 15000);
  fetch(SCRIPT_URL, {method: "POST", body: JSON.stringify(payload), headers: {"Content-Type": "text/plain"}, redirect: "follow", signal: controller.signal})
    .then(function(r) { clearTimeout(timeoutId); if(r.type==="opaque"||r.type==="opaqueredirect"){syncInProgress=false;console.log("Synced (opaque)");return} return r.json(); })
    .then(function(d) { syncInProgress = false; if(d)console.log("Synced to cloud:", d.timestamp); })
    .catch(function(e) { clearTimeout(timeoutId); syncInProgress = false; console.warn("Sync failed:", e); });
}

function loadFromCloud() {
  var controller = new AbortController();
  var timeoutId = setTimeout(function(){ controller.abort(); }, 15000);
  fetch(SCRIPT_URL + "?action=load&app=ai", {redirect: "follow", signal: controller.signal})
    .then(function(r) { clearTimeout(timeoutId); return r.json(); })
    .then(function(d) {
      var changed = false;
      if (d.items && d.items.length > 0) {
        d.items.forEach(function(item) {
          if (item.dueDate) item.dueDate = fixDate(item.dueDate);
          if (item.dateAdded) item.dateAdded = fixDate(item.dateAdded);
          if (item.subtasksJson){try{item.subtasks=JSON.parse(item.subtasksJson)}catch(e){item.subtasks=[]}delete item.subtasksJson}
          migrateItem(item);
        });
        var cloudIds = d.items.map(function(i) { return i.id; });
        var localIds = items.map(function(i) { return i.id; });
        var localOnly = items.filter(function(i) { return cloudIds.indexOf(i.id) === -1; });
        var cloudOnly = d.items.filter(function(i) { return localIds.indexOf(i.id) === -1; });
        var merged = items.slice();
        cloudOnly.forEach(function(ci) { merged.push(ci); });
        d.items.forEach(function(ci) {
          var li = merged.findIndex(function(m) { return m.id === ci.id; });
          if (li !== -1 && ci.completedAt && !merged[li].completedAt) merged[li] = ci;
          if (li !== -1 && ci.progress !== merged[li].progress && ci.completedAt > (merged[li].completedAt||"")) merged[li] = ci;
        });
        items = merged;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        localStorage.setItem(STORAGE_KEY+"_ver", String(EMBEDDED_VERSION));
        changed = true;
      }
      if (d.updates && d.updates.length > 0) {
        d.updates.forEach(function(u) { if (u.date) u.date = fixDate(u.date); });
        var cloudUIds = d.updates.map(function(u) { return u.id; });
        var localOnlyU = updates.filter(function(u) { return cloudUIds.indexOf(u.id) === -1; });
        updates = d.updates.concat(localOnlyU);
        localStorage.setItem(UPDATES_KEY, JSON.stringify(updates));
        changed = true;
      }
      // Only use cloud projects if they are valid strings
      if (d.projects && d.projects.length > 0 && typeof d.projects[0] === "string") {
        projects = d.projects;
        localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
        changed = true;
      }
      if (changed) { renderProjectTabs(); populateProjectDropdown(); refreshView(); }
      console.log("Loaded from cloud");
    })
    .catch(function(e) { clearTimeout(timeoutId); console.warn("Cloud load failed, using local:", e); });
}

var REMOVED_PROJECTS = ["LT7170-PSKIP", "OTHER TASKS", "Others"];
function isProjectName(p){return typeof p==="string"&&p!==""&&p.indexOf("__")!==0&&REMOVED_PROJECTS.indexOf(p)===-1}
function projectHasData(name){return items.some(function(i){return i.project===name})||updates.some(function(u){return u.project===name})}
// Saved project order first, then any project found in items/updates (alphabetical)
function getAllProjects(){
  var seen={},list=[],extra=[];
  projects.forEach(function(p){if(isProjectName(p)&&!seen[p]){seen[p]=1;list.push(p)}});
  items.concat(updates).forEach(function(x){var p=x&&x.project;if(isProjectName(p)&&!seen[p]){seen[p]=1;extra.push(p)}});
  extra.sort(function(a,b){return a.localeCompare(b)});
  return list.concat(extra);
}
