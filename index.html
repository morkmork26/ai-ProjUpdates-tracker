<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58a6ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AI Tracker - All Projects</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh;padding:24px}
body.light{background:#f6f8fa;color:#1f2328}
body.light .card{background:linear-gradient(135deg,#fff,#f6f8fa);border-color:#d0d7de}
body.light .card-label{color:#656d76}
body.light .tab{background:#fff;border-color:#d0d7de;color:#656d76}
body.light .tab:hover{border-color:#0969da;color:#0969da}
body.light .tab.active{background:#0969da11;border-color:#0969da;color:#0969da}
body.light .btn{background:#fff;border-color:#d0d7de;color:#656d76}
body.light .btn:hover{border-color:#0969da;color:#0969da}
body.light .btn.active{background:#0969da11;border-color:#0969da;color:#0969da}
body.light .add-form,body.light .modal-content{background:linear-gradient(135deg,#fff,#f6f8fa);border-color:#d0d7de}
body.light .form-group input,body.light .form-group select,body.light .form-group textarea{background:#fff;border-color:#d0d7de;color:#1f2328}
body.light .table-wrap{border-color:#d0d7de}
body.light th{background:#f6f8fa;color:#656d76}
body.light td{border-top-color:#d0d7de}
body.light tr:hover td{background:#f6f8fa88}
body.light .notes-row td{background:#f6f8fa}
body.light .notes-textarea{background:#fff;border-color:#d0d7de;color:#1f2328}
body.light .subtitle,body.light .empty{color:#656d76}
body.light .progress-container{background:#d0d7de}
body.light .block-input{background:#fff;border-color:#d0d7de;color:#1f2328}
input[type="date"]{color-scheme:dark}
body.light input[type="date"]{color-scheme:light}
h1{font-size:1.8rem;font-weight:700;background:linear-gradient(135deg,#58a6ff,#a371f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.subtitle{color:#8b949e;margin-bottom:24px;font-size:0.9rem}
.summary{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.card{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:16px 24px;min-width:140px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.card-value{font-size:2rem;font-weight:700}
.card-label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.card.notstarted .card-value{color:#8b949e}
.card.inprog .card-value{color:#58a6ff}
.card.blocked .card-value{color:#d29922}
.card.overdue .card-value{color:#f85149}
.card.done .card-value{color:#3fb950}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.tab{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s}
.tab:hover{border-color:#58a6ff;color:#58a6ff}
.tab.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.controls{display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap}
.btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.btn:hover{border-color:#58a6ff;color:#58a6ff}
.btn.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.btn-add{border-color:#3fb950;color:#3fb950}
.btn-add:hover{background:#3fb95022}
.btn-proj{border-color:#a371f7;color:#a371f7;padding:6px 12px}
.btn-proj:hover{background:#a371f722}
.add-form{display:none;background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:24px;margin-bottom:20px;position:relative;overflow:hidden}
.add-form.open{display:block;animation:slideDown .3s ease}
.add-form::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#58a6ff,#a371f7,#3fb950)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseAmber{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group label{font-size:.75rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.form-group input,.form-group select,.form-group textarea{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px 12px;border-radius:8px;font-size:.85rem;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#58a6ff}
.form-group textarea{resize:vertical;min-height:60px}
.form-actions{margin-top:16px;display:flex;gap:12px}
.btn-submit{background:linear-gradient(135deg,#238636,#2ea043);border:none;color:#fff;padding:10px 24px;border-radius:8px;cursor:pointer;font-weight:600;transition:transform .2s}
.btn-submit:hover{transform:scale(1.02)}
.table-wrap{overflow-x:auto;border-radius:12px;border:1px solid #30363d}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{background:#161b22;padding:12px 16px;text-align:left;color:#8b949e;text-transform:uppercase;font-size:.7rem;letter-spacing:1px;cursor:pointer;user-select:none;position:sticky;top:0}
th:hover{color:#58a6ff}
th.ns{cursor:default}
th.ns:hover{color:#8b949e}
td{padding:12px 16px;border-top:1px solid #21262d;transition:opacity .3s}
tr:hover td{background:#161b2288}
tr.done-row td{opacity:.5}
tr.done-row .task-text{text-decoration:line-through}
tr.drag-over td{border-top:2px solid #58a6ff}
.completed-at{display:block;font-size:.65rem;color:#8b949e;margin-top:2px}
.priority{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
.priority-high{background:#f85149;box-shadow:0 0 6px #f8514966;animation:pulse 2s infinite}
.priority-med{background:#d29922}
.priority-low{background:#484f58}
.due-warning{color:#d29922;font-weight:600}
.due-overdue{color:#f85149;font-weight:600}
.drag-handle{cursor:grab;color:#484f58;font-size:1rem;user-select:none}
.drag-handle:hover{color:#8b949e}
.empty{text-align:center;padding:48px;color:#8b949e}
.project-badge{background:#a371f722;color:#a371f7;padding:2px 8px;border-radius:4px;font-size:.75rem}
.checkbox{width:18px;height:18px;cursor:pointer;accent-color:#3fb950}
.notes-row{display:none}
.notes-row.open{display:table-row;animation:slideDown .2s ease}
.notes-row td{background:#161b22;padding:8px 16px 16px 60px}
.notes-textarea{width:100%;background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:10px;border-radius:8px;font-size:.8rem;resize:vertical;min-height:50px}
.notes-textarea:focus{outline:none;border-color:#58a6ff}
.expand-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.8rem;transition:transform .2s,color .2s}
.expand-btn:hover{color:#58a6ff}
.expand-btn.open{transform:rotate(90deg)}
.edit-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:4px}
.edit-btn:hover{color:#58a6ff}
.delete-btn{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:4px}
.delete-btn:hover{color:#f85149}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-content{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;min-width:320px}
.modal-content h3{color:#c9d1d9;margin-bottom:16px}
.progress-container{width:100%;height:6px;background:#21262d;border-radius:3px;margin-top:6px;cursor:pointer;position:relative;overflow:hidden}
.progress-fill{height:100%;border-radius:3px;transition:width .3s ease,background .3s ease}
.progress-fill.not-started{width:0%;background:#484f58}
.progress-fill.in-progress{width:50%;background:#58a6ff}
.progress-fill.blocked{width:50%;background:#d29922;animation:pulseAmber 2s infinite}
.progress-fill.done{width:100%;background:#3fb950}
.progress-label{font-size:.65rem;color:#8b949e;margin-top:3px}
.progress-label .stage{font-weight:600}
.progress-label .stage.not-started{color:#8b949e}
.progress-label .stage.in-progress{color:#58a6ff}
.progress-label .stage.blocked{color:#d29922}
.progress-label .stage.done{color:#3fb950}
.block-input{background:#0d1117;border:1px solid #d29922;color:#d29922;padding:4px 8px;border-radius:4px;font-size:.7rem;margin-top:3px;width:100%;max-width:250px}
.block-input:focus{outline:none;border-color:#58a6ff}
.task-cell{min-width:200px}
.subtask-row td{padding:8px 16px 8px 32px;border-top:1px solid #21262d44;font-size:.8rem}
.subtask-row td:first-child{position:relative}
.subtask-branch{position:absolute;left:16px;top:0;bottom:50%;width:14px;border-left:2px solid #30363d;border-bottom:2px solid #30363d;border-radius:0 0 0 6px}
.subtask-branch.dashed{border-left-style:dashed;border-bottom-style:dashed}
.subtask-task{color:#9ca3b0}
.subtask-progress{width:80%;max-width:200px;height:4px;background:#21262d;border-radius:2px;margin-top:4px;overflow:hidden}
.subtask-progress-fill{height:100%;border-radius:2px}
.subtask-checkbox{width:14px;height:14px;accent-color:#3fb950}
.subtask-stage{font-size:.6rem;margin-top:2px;font-weight:600}
.subtask-add-btn{background:none;border:1px dashed #30363d;color:#484f58;padding:4px 10px;border-radius:6px;font-size:.7rem;cursor:pointer;transition:all .2s}
.subtask-add-btn:hover{border-color:#58a6ff;color:#58a6ff}
.subtask-count{font-size:.6rem;color:#8b949e;background:#21262d;padding:2px 6px;border-radius:8px;margin-left:8px}
.subtask-count.complete{background:#3fb95022;color:#3fb950}
.add-sub-btn{background:none;border:none;color:#3fb950;cursor:pointer;font-size:.75rem;padding:4px;transition:color .2s}
.add-sub-btn:hover{color:#3fb950cc}
.subtask-inline-input{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:6px 10px;border-radius:6px;font-size:.8rem;width:100%;max-width:300px}
.subtask-inline-input:focus{outline:none;border-color:#58a6ff}
.done-subtask .subtask-task{text-decoration:line-through;opacity:.5}
@media(max-width:768px){
.summary{flex-direction:column}
.form-grid{grid-template-columns:1fr}
.table-wrap{display:none}
.mobile-cards{display:flex!important;flex-direction:column;gap:12px;margin-top:12px}
.tabs{gap:6px}
.tab{padding:6px 12px;font-size:.75rem}
.controls{flex-direction:column;gap:8px}
.wins-header{flex-direction:row;justify-content:space-between}
.wins-stat{min-width:0;flex:1;padding:12px 10px}
.wins-stat .ws-val{font-size:1.3rem}
.win-card{padding:12px 14px}
.win-card .win-meta{flex-direction:column;gap:4px}
.week-header{flex-wrap:wrap;gap:8px}
.week-divider{flex-wrap:wrap;gap:6px}
.timeline-entry{flex-direction:column;gap:6px}
.timeline-entry .entry-date{min-width:unset;display:flex;gap:8px;align-items:center}
.update-form .form-grid{grid-template-columns:1fr}
}
.mobile-cards{display:none}
.mobile-card{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:14px;position:relative;overflow:hidden}
.mobile-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px}
.mobile-card.mc-blocked::before{background:#d29922}
.mobile-card.mc-in-progress::before{background:#58a6ff}
.mobile-card.mc-overdue::before{background:#f85149}
.mobile-card.mc-done::before{background:#3fb950}
.mobile-card.mc-done{opacity:.5}
.mobile-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.mobile-card-title{font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:6px;flex:1}
.mobile-card-title .task-text-m{flex:1}
.mobile-card-meta{display:flex;gap:12px;font-size:.7rem;color:#8b949e;margin-bottom:6px;flex-wrap:wrap}
.mobile-card-actions{display:flex;gap:8px;align-items:center}
.mobile-card-actions button{background:none;border:none;color:#484f58;font-size:1rem;cursor:pointer;padding:4px}
.mobile-card-progress{margin-top:6px}
.mobile-subtasks{margin-top:10px;padding-top:10px;border-top:1px solid #21262d}
.mobile-subtask{display:flex;align-items:center;gap:8px;padding:6px 0 6px 12px;border-left:2px solid #30363d;margin-left:4px;margin-bottom:6px}
.mobile-subtask.ms-done{opacity:.5}
.mobile-subtask.ms-done .ms-text{text-decoration:line-through}
.ms-text{font-size:.78rem;color:#9ca3b0;flex:1}
.ms-prog{width:50px;height:4px;background:#21262d;border-radius:2px;overflow:hidden}
.ms-prog-fill{height:100%;border-radius:2px}
.mobile-sub-input{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:6px 10px;border-radius:6px;font-size:.78rem;width:100%;margin-top:6px;margin-left:12px;border-left:2px dashed #30363d}
.mobile-sub-input:focus{outline:none;border-color:#58a6ff}
.mobile-add-sub{font-size:.7rem;color:#484f58;padding:4px 0 0 12px;border-left:2px dashed #21262d;margin-left:4px;cursor:pointer}
.mobile-add-sub:hover{color:#58a6ff}
body.light .mobile-card{background:linear-gradient(135deg,#fff,#f6f8fa);border-color:#d0d7de}
body.light .mobile-subtask{border-left-color:#d0d7de}
body.light .ms-text{color:#1f2328}
body.light .mobile-card-meta{color:#656d76}
body.light .mobile-sub-input{background:#fff;border-color:#d0d7de;color:#1f2328}

/* Updates Tab Styles */
.updates-container{display:none;animation:slideDown .3s ease}
.updates-container.open{display:block}
.updates-filter{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.updates-filter .filter-btn{background:#21262d;border:1px solid #30363d;color:#8b949e;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:all .2s}
.updates-filter .filter-btn:hover{border-color:#a371f7;color:#a371f7}
.updates-filter .filter-btn.active{background:#a371f722;border-color:#a371f7;color:#a371f7}
.update-form{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:20px;margin-bottom:24px;position:relative;overflow:hidden}
.update-form::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#a371f7,#58a6ff,#3fb950)}
.update-form .form-grid{display:grid;grid-template-columns:180px 150px 1fr auto;gap:12px;align-items:end}
.update-form .form-grid textarea{min-height:38px;resize:none}
@media(max-width:768px){.update-form .form-grid{grid-template-columns:1fr}}
.timeline{display:flex;flex-direction:column;gap:16px}
.timeline-group{margin-bottom:24px}
.timeline-group-header{font-size:1rem;font-weight:700;color:#a371f7;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #30363d;display:flex;align-items:center;gap:8px}
.timeline-group-header .count-badge{background:#a371f722;color:#a371f7;padding:2px 8px;border-radius:10px;font-size:.7rem;font-weight:600}
.timeline-entry{display:flex;gap:12px;padding:14px 16px;background:#161b22;border:1px solid #30363d;border-radius:10px;border-left:3px solid #a371f7;transition:transform .2s,box-shadow .2s}
.timeline-entry:hover{transform:translateX(4px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.timeline-entry .entry-date{min-width:90px;font-size:.75rem;color:#58a6ff;font-weight:600;padding-top:2px}
.timeline-entry .entry-text{flex:1;font-size:.85rem;line-height:1.5;color:#c9d1d9}
.timeline-entry .entry-delete{background:none;border:none;color:#484f58;cursor:pointer;font-size:.9rem;padding:2px 6px;transition:color .2s}
.timeline-entry .entry-delete:hover{color:#f85149}
.timeline-empty{text-align:center;padding:48px;color:#8b949e;font-size:.9rem}
body.light .update-form{background:linear-gradient(135deg,#fff,#f6f8fa);border-color:#d0d7de}
body.light .timeline-entry{background:#fff;border-color:#d0d7de;border-left-color:#8250df}
body.light .timeline-entry:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
body.light .timeline-entry .entry-text{color:#1f2328}
body.light .timeline-group-header{color:#8250df;border-bottom-color:#d0d7de}
body.light .timeline-group-header .count-badge{background:#8250df22;color:#8250df}
body.light .updates-filter .filter-btn{background:#fff;border-color:#d0d7de;color:#656d76}
body.light .updates-filter .filter-btn:hover{border-color:#8250df;color:#8250df}
body.light .updates-filter .filter-btn.active{background:#8250df11;border-color:#8250df;color:#8250df}

/* Wins / History Styles */
.wins-container{display:none;animation:slideDown .3s ease}
.wins-container.open{display:block}
.wins-header{display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.wins-stat{background:linear-gradient(135deg,#161b22,#1c2128);border:1px solid #30363d;border-radius:12px;padding:14px 20px;text-align:center;min-width:120px}
.wins-stat .ws-val{font-size:1.6rem;font-weight:700;color:#3fb950}
.wins-stat .ws-lbl{font-size:.65rem;color:#8b949e;text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.wins-stat.streak .ws-val{color:#f0883e}
.week-section{margin-bottom:32px}
.week-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #21262d}
.week-header .wh-label{font-size:.95rem;font-weight:700;color:#3fb950}
.week-header .wh-range{font-size:.75rem;color:#8b949e}
.week-header .wh-count{background:#3fb95022;color:#3fb950;padding:3px 10px;border-radius:10px;font-size:.7rem;font-weight:600}
.week-header .wh-current{background:linear-gradient(135deg,#3fb950,#2ea043);color:#fff;padding:3px 10px;border-radius:10px;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.win-card{display:flex;gap:14px;padding:14px 18px;background:#161b22;border:1px solid #30363d;border-radius:10px;border-left:3px solid #3fb950;margin-bottom:10px;transition:transform .2s,box-shadow .2s;align-items:flex-start}
.win-card:hover{transform:translateX(4px);box-shadow:0 4px 16px rgba(63,185,80,.1)}
.win-card .win-check{color:#3fb950;font-size:1.2rem;margin-top:2px}
.win-card .win-body{flex:1}
.win-card .win-task{font-size:.88rem;font-weight:600;color:#c9d1d9;margin-bottom:4px}
.win-card .win-meta{display:flex;gap:12px;font-size:.7rem;color:#8b949e;flex-wrap:wrap;align-items:center}
.win-card .win-meta .win-duration{background:#58a6ff22;color:#58a6ff;padding:2px 8px;border-radius:6px;font-weight:600}
.win-card .win-meta .win-added{color:#484f58}
.wins-empty{text-align:center;padding:48px;color:#8b949e}
.wins-empty .wins-empty-icon{font-size:3rem;margin-bottom:12px;opacity:.4}
body.light .wins-stat{background:linear-gradient(135deg,#fff,#f6f8fa);border-color:#d0d7de}
body.light .week-header{border-bottom-color:#d0d7de}
body.light .win-card{background:#fff;border-color:#d0d7de;border-left-color:#2da44e}
body.light .win-card:hover{box-shadow:0 4px 16px rgba(45,164,78,.08)}
body.light .win-card .win-task{color:#1f2328}

/* Updates weekly dividers */
.week-divider{display:flex;align-items:center;gap:12px;margin:20px 0 14px;padding-bottom:8px;border-bottom:1px solid #21262d}
.week-divider .wd-label{font-size:.8rem;font-weight:700;color:#58a6ff}
.week-divider .wd-range{font-size:.7rem;color:#8b949e}
.week-divider .wd-count{background:#58a6ff22;color:#58a6ff;padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600}
body.light .week-divider{border-bottom-color:#d0d7de}
</style>
</head>
<body>
<h1>AI Tracker - All Projects</h1>
<p class="subtitle">Last updated: <span id="lastUpdate"></span></p>
<div class="summary" id="summary"></div>
<div class="tabs" id="tabs"><button class="tab active" data-filter="all">All</button><button class="btn btn-proj" id="addProjectBtn">+</button></div>
<div class="controls" style="justify-content:space-between">
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn btn-add" id="addBtn">+ Add AI</button>
    <button class="btn" id="toggleDone">Hide Done</button>
    <button class="btn" id="toggleSort">Manual Order</button>
    <button class="btn" id="toggleMine">My AIs</button>
  </div>

function getSubtasksForItem(parentId){

  if(!task)return;

  if(!item.subtasks)item.subtasks=[];

  items.forEach(function(item){if(item.subtasks)item.subtasks=item.subtasks.filter(function(s){return s.id!==id})});

function findSubtask(id){
  for(var i=0;i<items.length;i++){if(items[i].subtasks){for(var j=0;j<items[i].subtasks.length;j++){if(items[i].subtasks[j].id===id)return items[i].subtasks[j]}}}

}
function cycleSubtaskProgress(id){
  pushUndo();

function getWeekKey(dateStr){
  var d=normalizeToDay(dateStr);
  var day=d.getDay();var diff=d.getDate()-day+(day===0?-6:1);
  var mon=new Date(d.getFullYear(),d.getMonth(),diff);
  return mon.toISOString().split("T")[0];
}
function getWeekRange(mondayStr){
  var m=normalizeToDay(mondayStr);
  var s=new Date(m);s.setDate(s.getDate()+6);
  var fmt=function(d){return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})};
  return fmt(m)+" - "+fmt(s);
}
function isCurrentWeek(mondayStr){
  var today=todayNormalized();
  return getWeekKey(today.toISOString().split("T")[0])===mondayStr;
}
function renderUpdates(){
  var filtered=updatesFilter==="all"?updates:updates.filter(function(u){return u.project===updatesFilter});
  filtered.sort(function(a,b){return b.date.localeCompare(a.date)||b.id-a.id});

  projects.forEach(function(p){
    var ct=updates.filter(function(u){return u.project===p}).length;

  });

  document.querySelectorAll("[data-uf]").forEach(function(btn){
    btn.addEventListener("click",function(){updatesFilter=btn.dataset.uf;renderUpdates()});

function renderWins(){
  var done=items.filter(function(i){return i.progress==="done"&&i.completedAt});
  if(winsFilter!=="all")done=done.filter(function(i){return i.project===winsFilter});
  done.sort(function(a,b){return b.completedAt.localeCompare(a.completedAt)});
  var filterHtml='<button class="filter-btn'+(winsFilter==="all"?" active":"")+'" data-wf="all">All</button>';
  projects.forEach(function(p){
    var ct=items.filter(function(i){return i.progress==="done"&&i.completedAt&&i.project===p}).length;
    if(ct>0)filterHtml+='<button class="filter-btn'+(winsFilter===p?" active":"")+'" data-wf="'+esc(p)+'">'+esc(p)+' ('+ct+')</button>';
  });
  document.getElementById("winsFilter").innerHTML=filterHtml;
  document.querySelectorAll("[data-wf]").forEach(function(btn){
    btn.addEventListener("click",function(){winsFilter=btn.dataset.wf;renderWins()});
  });
  var thisWeekKey=getWeekKey(todayNormalized().toISOString().split("T")[0]);
  var thisWeekCount=done.filter(function(i){return getWeekKey(i.completedAt.split("T")[0])===thisWeekKey}).length;
  var totalDone=done.length;
  var streak=0;
  var checkWeek=new Date(todayNormalized());
  while(true){
    var wk=getWeekKey(checkWeek.toISOString().split("T")[0]);
    var ct=done.filter(function(i){return getWeekKey(i.completedAt.split("T")[0])===wk}).length;
    if(ct>0){streak++;checkWeek.setDate(checkWeek.getDate()-7)}else break;
  }
  var hdrHtml='<div class="wins-stat"><div class="ws-val">'+thisWeekCount+'</div><div class="ws-lbl">This Week</div></div>';
  hdrHtml+='<div class="wins-stat"><div class="ws-val">'+totalDone+'</div><div class="ws-lbl">All Time</div></div>';
  hdrHtml+='<div class="wins-stat streak"><div class="ws-val">'+streak+'w</div><div class="ws-lbl">Streak</div></div>';
  document.getElementById("winsHeader").innerHTML=hdrHtml;
  var weeks={};
  done.forEach(function(i){var wk=getWeekKey(i.completedAt.split("T")[0]);if(!weeks[wk])weeks[wk]=[];weeks[wk].push(i)});
  var weekKeys=Object.keys(weeks).sort(function(a,b){return b.localeCompare(a)});
  var html="";
  if(!weekKeys.length){
    html='<div class="wins-empty"><div class="wins-empty-icon">&#127942;</div>Complete your first task to see it here!</div>';
  } else {
    weekKeys.forEach(function(wk){
      var curr=isCurrentWeek(wk);
      html+='<div class="week-section"><div class="week-header"><span class="wh-label">Week of '+getWeekRange(wk)+'</span>';
      if(curr)html+='<span class="wh-current">This Week</span>';
      html+='<span class="wh-count">'+weeks[wk].length+' completed</span></div>';
      weeks[wk].forEach(function(i){
        var addedStr=i.dateAdded?i.dateAdded:"unknown";
        var doneDate=new Date(i.completedAt);
        var doneStr=doneDate.toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});
        var dur="";
        if(i.dateAdded){
          var diffMs=doneDate-normalizeToDay(i.dateAdded);
          var days=Math.round(diffMs/(1000*60*60*24));
          dur=days<=0?"same day":days===1?"1 day":days+" days";
        }
        html+='<div class="win-card">';
        html+='<div class="win-check">&#10003;</div>';
        html+='<div class="win-body">';
        html+='<div class="win-task">'+esc(i.task)+'</div>';
        html+='<div class="win-meta">';
        html+='<span class="project-badge">'+esc(i.project)+'</span>';
        html+='<span class="win-added">Added '+addedStr+'</span>';
        html+='<span>Done '+doneStr+'</span>';
        if(dur)html+='<span class="win-duration">'+dur+'</span>';
        html+='</div></div></div>';
      });
      html+='</div>';
    });
  }
  document.getElementById("winsTimeline").innerHTML=html;
}

function migrateItem(item){
  if(!item.progress){if(item.status==="Done")item.progress="done";else if(item.status==="In Progress")item.progress="in-progress";else item.progress="not-started"}
  if(!item.blockReason)item.blockReason="";
  if(!item.priority)item.priority="Med";
  if(!item.notes)item.notes="";
  if(!item.completedAt)item.completedAt=null;
  if(item.sortOrder===undefined)item.sortOrder=0;
  if(!item.subtasks)item.subtasks=[];
  if(item.project==="LT8460 Die Rev")item.project="LT8460";
  return item;
}
function loadProjects(){
  var s=localStorage.getItem(PROJECTS_KEY);
  if(s){var arr=safeParseJSON(s,[]);if(!Array.isArray(arr))arr=[];return arr.filter(function(p,i){return typeof p==="string"&&arr.indexOf(p)===i&&p!=="__updates__"&&p!=="asd"&&p!=="LT8460 Die Rev"})}

}

    var raw=safeParseJSON(stored,[]);if(!Array.isArray(raw))raw=[];
    var saved=raw.map(migrateItem);
    var ver=parseInt(localStorage.getItem(STORAGE_KEY+"_ver"))||0;
    if(EMBEDDED_VERSION>ver){
      var ids=saved.map(function(s){return s.id});
      EMBEDDED_ITEMS.forEach(function(ei){if(ids.indexOf(ei.id)===-1)saved.push(migrateItem(JSON.parse(JSON.stringify(ei))))});
      localStorage.setItem(STORAGE_KEY,JSON.stringify(saved));
      localStorage.setItem(STORAGE_KEY+"_ver",String(EMBEDDED_VERSION));
    }
    return saved;
  }
  var res=EMBEDDED_ITEMS.map(function(item){return migrateItem(JSON.parse(JSON.stringify(item)))});
  localStorage.setItem(STORAGE_KEY,JSON.stringify(res));
  localStorage.setItem(STORAGE_KEY+"_ver",String(EMBEDDED_VERSION));
  return res;
}

function pushUndo(){undoStack.push(JSON.stringify(items));if(undoStack.length>MAX_UNDO)undoStack.shift();redoStack=[]}
function getStatus(item){
  if(item.progress==="done")return"done";
  if(item.progress==="blocked")return"blocked";
  if(item.dueDate&&normalizeToDay(item.dueDate)<todayNormalized()&&item.progress!=="done")return"overdue";
  if(item.progress==="in-progress")return"in-progress";
  return"not-started";
}
function getDueClass(item){
  if(!item.dueDate||item.progress==="done")return"";
  var diff=(normalizeToDay(item.dueDate)-todayNormalized())/(1000*60*60*24);
  if(diff<0)return"due-overdue";if(diff<=3)return"due-warning";return"";
}
function cycleProgress(id){
  pushUndo();
  var item=items.find(function(i){return i.id===id});if(!item)return;
  var idx=STAGES.indexOf(item.progress);
  item.progress=STAGES[(idx+1)%STAGES.length];
  if(item.progress==="done"){item.completedAt=new Date().toISOString()}else{item.completedAt=null}
  if(item.progress!=="blocked")item.blockReason="";
  saveItems();render();
  if(item.progress==="blocked")setTimeout(function(){var el=document.getElementById("block-input-"+id);if(el)el.focus()},100);
}
function toggleItem(id){
  pushUndo();
  var item=items.find(function(i){return i.id===id});if(!item)return;
  if(item.progress==="done"){item.progress="in-progress";item.completedAt=null}
  else{
    var subs=getSubtasksForItem(id);
    var pending=subs.filter(function(s){return s.progress!=="done"});
    if(pending.length>0&&!confirm(pending.length+" sub-task(s) not done. Mark parent as Done anyway?"))return;
    item.progress="done";item.completedAt=new Date().toISOString();
  }
  item.blockReason="";saveItems();render();
}
function deleteItem(id){
  if(!confirm("Delete this AI?"))return;
  pushUndo();items=items.filter(function(i){return i.id!==id});
  saveItems();render();
}
function toggleNotes(id){
  var row=document.getElementById("notes-"+id);var btn=document.getElementById("exp-"+id);
  if(row){row.classList.toggle("open");btn.classList.toggle("open")}
}
function editItem(id){
  var item=items.find(function(i){return i.id===id});if(!item)return;
  document.getElementById("edit-id").value=id;
  document.getElementById("edit-task").value=item.task;
  document.getElementById("edit-owner").value=item.owner;
  document.getElementById("edit-due").value=item.dueDate||"";
  document.getElementById("edit-source").value=item.source||"";
  document.getElementById("edit-priority").value=item.priority||"Med";
  var sel=document.getElementById("edit-project");sel.innerHTML="";
  projects.forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;if(p===item.project)o.selected=true;sel.appendChild(o)});
  document.getElementById("editModal").classList.add("open");
}
function getBlockHtml(item){
  if(item.progress==="blocked"){
    var val=(item.blockReason||"").replace(/"/g,"&quot;");
    return '<input class="block-input" id="block-input-'+item.id+'" value="'+val+'" placeholder="Reason...">';
  }
  return"";
}
function render(){
  var filtered=items.filter(function(i){return currentFilter==="all"||i.project===currentFilter});
  if(showMineOnly)filtered=filtered.filter(function(i){return MY_NAMES.indexOf((i.owner||"").toLowerCase())!==-1});
  if(hideDone)filtered=filtered.filter(function(i){return getStatus(i)!=="done"});
  if(manualSort)filtered.sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
  else filtered.sort(function(a,b){var va=a[sortCol]||"",vb=b[sortCol]||"";if(sortCol==="id"){va=+va;vb=+vb};return sortAsc?(va>vb?1:-1):(va<vb?1:-1)});
  var tbody=document.getElementById("tbody");var h="";
  filtered.forEach(function(i,idx){
    var s=getStatus(i);
    var checked=i.progress==="done"?"checked":"";
    var rowClass=i.progress==="done"?"done-row":"";
    var dueClass=getDueClass(i);
    var pClass=i.priority==="High"?"priority-high":i.priority==="Low"?"priority-low":"priority-med";
    var ct=i.completedAt?'<span class="completed-at">Done '+new Date(i.completedAt).toLocaleDateString("en-US",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})+"</span>":"";
    var draggable=manualSort?'draggable="true"':"";
    h+='<tr class="'+rowClass+'" data-id="'+i.id+'" '+draggable+'>';
    h+='<td><span class="drag-handle" style="visibility:'+(manualSort?"visible":"hidden")+'">::</span></td>';
    h+='<td><button class="expand-btn" id="exp-'+i.id+'" onclick="toggleNotes('+i.id+')">&rsaquo;</button></td>';
    h+='<td><input type="checkbox" class="checkbox" '+checked+' onchange="toggleItem('+i.id+')"></td>';
    h+='<td>'+(idx+1)+'</td>';
    h+='<td><span class="project-badge">'+esc(i.project)+'</span></td>';
    h+='<td class="task-cell"><span class="priority '+pClass+'"></span><span class="task-text">'+esc(i.task)+'</span>';
    h+=getSubtaskCountHtml(i.id);
    h+='<div class="progress-container" onclick="cycleProgress('+i.id+')" title="Click to cycle: Not Started > In Progress > Blocked > Done"><div class="progress-fill '+i.progress+'"></div></div>';
    h+='<div class="progress-label"><span class="stage '+i.progress+'">'+STAGE_LABELS[i.progress]+'</span></div>';
    h+=getBlockHtml(i)+ct+'</td>';
    h+='<td>'+esc(i.owner)+'</td>';
    h+='<td class="'+dueClass+'">'+(i.dueDate||"-")+'</td>';
    h+='<td>'+esc(i.source||"-")+'</td>';
    h+='<td><button class="add-sub-btn" onclick="toggleSubtaskExpand('+i.id+')" title="Sub-tasks">+sub</button> <button class="edit-btn" onclick="editItem('+i.id+')" title="Edit">&#9998;</button> <button class="delete-btn" onclick="deleteItem('+i.id+')" title="Delete">&times;</button></td>';
    h+='</tr>';
    h+='<tr class="notes-row" id="notes-'+i.id+'"><td colspan="10"><textarea class="notes-textarea" id="note-text-'+i.id+'" placeholder="Add notes...">'+(i.notes||"")+'</textarea></td></tr>';
    // Sub-task rows
    if(expandedSubtasks[i.id]){
      var subs=getSubtasksForItem(i.id);
      subs.sort(function(a,b){return(a.sortOrder||0)-(b.sortOrder||0)});
      subs.forEach(function(st,si){
        var stChecked=st.progress==="done"?"checked":"";
        var stDoneClass=st.progress==="done"?"done-subtask":"";
        var stFillClass=st.progress;
        var stFillW=st.progress==="done"?"100%":st.progress==="in-progress"?"50%":st.progress==="blocked"?"50%":"0%";
        var stColor=st.progress==="done"?"#3fb950":st.progress==="in-progress"?"#58a6ff":st.progress==="blocked"?"#d29922":"#484f58";
        h+='<tr class="subtask-row '+stDoneClass+'">';
        h+='<td><div class="subtask-branch"></div></td>';
        h+='<td></td>';
        h+='<td><input type="checkbox" class="subtask-checkbox" '+stChecked+' onchange="toggleSubtask('+st.id+')"></td>';
        h+='<td style="color:#484f58;font-size:.7rem">'+(idx+1)+'.'+(si+1)+'</td>';
        h+='<td></td>';
        h+='<td><span class="subtask-task">'+esc(st.task)+'</span>';
        h+='<div class="subtask-progress" onclick="cycleSubtaskProgress('+st.id+')" title="Click to cycle"><div class="subtask-progress-fill" style="width:'+stFillW+';background:'+stColor+'"></div></div>';
        h+='<span class="subtask-stage" style="color:'+stColor+'">'+STAGE_LABELS[st.progress]+'</span>';
        if(st.progress==="blocked")h+='<input class="block-input" id="block-input-sub-'+st.id+'" value="'+(st.blockReason||"").replace(/"/g,"&quot;")+'" placeholder="Reason..." style="max-width:200px">';
        h+='</td>';
        h+='<td></td><td></td><td></td>';
        h+='<td><button class="delete-btn" onclick="deleteSubtask('+st.id+')" style="font-size:.75rem">&times;</button></td>';
        h+='</tr>';
      });
      // Add sub-task input row
      h+='<tr class="subtask-row">';
      h+='<td><div class="subtask-branch dashed"></div></td>';
      h+='<td colspan="9"><input class="subtask-inline-input" id="sub-input-'+i.id+'" placeholder="Add a sub-task... (Enter to save)" onkeydown="if(event.key===\'Enter\'){addSubtask('+i.id+',this.value);this.value=\'\'}"></td>';
      h+='</tr>';
    }
  });
  tbody.innerHTML=h;
  document.getElementById("empty").style.display=filtered.length?"none":"block";
  if(manualSort){
    tbody.querySelectorAll("tr[draggable]").forEach(function(row){
      row.addEventListener("dragstart",function(){dragId=+row.dataset.id;row.style.opacity="0.4"});
      row.addEventListener("dragend",function(){row.style.opacity="1";dragId=null});
      row.addEventListener("dragover",function(e){e.preventDefault();row.classList.add("drag-over")});
      row.addEventListener("dragleave",function(){row.classList.remove("drag-over")});
      row.addEventListener("drop",function(e){
        e.preventDefault();row.classList.remove("drag-over");
        var tid=+row.dataset.id;if(dragId===null||dragId===tid)return;
        var di=items.findIndex(function(x){return x.id===dragId});
        var ti=items.findIndex(function(x){return x.id===tid});
        var m=items.splice(di,1)[0];items.splice(ti,0,m);
        items.forEach(function(x,idx){x.sortOrder=idx});saveItems();render();
      });
    });
  }
  var all=currentFilter==="all"?items:items.filter(function(i){return i.project===currentFilter});
  var ns=all.filter(function(i){return i.progress==="not-started"}).length;
  var ip=all.filter(function(i){return i.progress==="in-progress"}).length;
  var bl=all.filter(function(i){return i.progress==="blocked"}).length;
  var od=all.filter(function(i){return i.dueDate&&normalizeToDay(i.dueDate)<todayNormalized()&&i.progress!=="done"}).length;
  var dn=all.filter(function(i){return i.progress==="done"}).length;
  document.getElementById("summary").innerHTML='<div class="card notstarted"><div class="card-value">'+ns+'</div><div class="card-label">Not Started</div></div><div class="card inprog"><div class="card-value">'+ip+'</div><div class="card-label">In Progress</div></div><div class="card blocked"><div class="card-value">'+bl+'</div><div class="card-label">Blocked</div></div><div class="card overdue"><div class="card-value">'+od+'</div><div class="card-label">Overdue</div></div><div class="card done"><div class="card-value">'+dn+'</div><div class="card-label">Done</div></div>';
  // Mobile cards render
  renderMobileCards(filtered);
}
function renderMobileCards(filtered){
  var mc=document.getElementById("mobileCards");
  var mh="";
  filtered.forEach(function(i){
    var s=getStatus(i);
    var mcClass="mc-"+s;
    var pDot=i.priority==="High"?"priority-high":i.priority==="Low"?"priority-low":"priority-med";
    var dueStr=i.dueDate?i.dueDate:"-";
    var dueClass=getDueClass(i);
    var subs=getSubtasksForItem(i.id);
    var subsDone=subs.filter(function(x){return x.progress==="done"}).length;
    var stageColor=i.progress==="done"?"#3fb950":i.progress==="in-progress"?"#58a6ff":i.progress==="blocked"?"#d29922":"#8b949e";
    var blockText=i.progress==="blocked"&&i.blockReason?" - "+i.blockReason:"";
    mh+='<div class="mobile-card '+mcClass+'" data-id="'+i.id+'">';
    mh+='<div class="mobile-card-header">';
    mh+='<div class="mobile-card-title"><span class="priority '+pDot+'"></span><span class="task-text-m">'+(i.progress==="done"?"<s>"+esc(i.task)+"</s>":esc(i.task))+'</span></div>';
    mh+='<span class="project-badge">'+esc(i.project)+'</span>';
    mh+='</div>';
    mh+='<div class="mobile-card-meta">';
    mh+='<span>'+esc(i.owner)+'</span>';
    mh+='<span class="'+dueClass+'">Due: '+dueStr+'</span>';
    if(subs.length)mh+='<span class="subtask-count'+(subsDone===subs.length?" complete":"")+'">'+subsDone+'/'+subs.length+'</span>';
    if(i.source)mh+='<span>'+esc(i.source)+'</span>';
    mh+='</div>';
    mh+='<div class="mobile-card-progress">';
    mh+='<div class="progress-container" onclick="cycleProgress('+i.id+')"><div class="progress-fill '+i.progress+'"></div></div>';
    mh+='<span class="stage '+i.progress+'" style="font-size:.65rem">'+STAGE_LABELS[i.progress]+blockText+'</span>';
    mh+='</div>';
    mh+='<div class="mobile-card-actions">';
    mh+='<button onclick="toggleSubtaskExpand('+i.id+')" title="Sub-tasks" style="color:#3fb950;font-size:.75rem">+sub</button>';
    mh+='<button onclick="editItem('+i.id+')" style="color:#58a6ff">&#9998;</button>';
    mh+='<button onclick="deleteItem('+i.id+')" style="color:#f85149">&times;</button>';
    mh+='<input type="checkbox" class="checkbox" '+(i.progress==="done"?"checked":"")+' onchange="toggleItem('+i.id+')">';
    mh+='</div>';
    // Sub-tasks
    if(expandedSubtasks[i.id]||subs.length>0){
      mh+='<div class="mobile-subtasks"'+(expandedSubtasks[i.id]?'':' style="display:none"')+'>';
      subs.forEach(function(st){
        var stColor=st.progress==="done"?"#3fb950":st.progress==="in-progress"?"#58a6ff":st.progress==="blocked"?"#d29922":"#484f58";
        var stW=st.progress==="done"?"100%":st.progress==="in-progress"?"50%":st.progress==="blocked"?"50%":"0%";
        var stDoneClass=st.progress==="done"?"ms-done":"";
        mh+='<div class="mobile-subtask '+stDoneClass+'" onclick="cycleSubtaskProgress('+st.id+')">';
        mh+='<input type="checkbox" class="subtask-checkbox" '+(st.progress==="done"?"checked":"")+' onchange="event.stopPropagation();toggleSubtask('+st.id+')">';
        mh+='<span class="ms-text">'+esc(st.task)+'</span>';
        mh+='<div class="ms-prog"><div class="ms-prog-fill" style="width:'+stW+';background:'+stColor+'"></div></div>';
        mh+='</div>';
      });
      if(expandedSubtasks[i.id]){
        mh+='<input class="mobile-sub-input" id="msub-input-'+i.id+'" placeholder="Add sub-task... (Enter)" onkeydown="if(event.key===\'Enter\'){addSubtask('+i.id+',this.value);this.value=\'\'}">';
      }
      mh+='</div>';
    }
    mh+='</div>';
  });
  mc.innerHTML=mh;
}
function addProjectToUI(name){
  var tabs=document.getElementById("tabs");
  if(tabs.querySelector('[data-filter="'+name+'"]'))return;
  var addBtn=document.getElementById("addProjectBtn");
  var btn=document.createElement("button");
  btn.className="tab";btn.dataset.filter=name;btn.textContent=name;btn.setAttribute("draggable","true");
  btn.addEventListener("click",function(){
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("active")});
    btn.classList.add("active");currentFilter=name;hideUpdatesView();hideWinsView();render();
  });
  tabs.insertBefore(btn,addBtn);
  var sel=document.getElementById("f-project");
  if(!sel.querySelector('option[value="'+name+'"]')){var o=document.createElement("option");o.value=name;o.textContent=name;sel.appendChild(o)}
}
function populateProjectDropdown(){
  var sel=document.getElementById("f-project");sel.innerHTML="";
  projects.forEach(function(p){var o=document.createElement("option");o.value=p;o.textContent=p;sel.appendChild(o)});
}

// Tab reorder via drag
(function(){
  var tabs=document.getElementById("tabs");var dragTab=null;
  tabs.addEventListener("dragstart",function(e){
    var tab=e.target.closest(".tab");if(!tab||tab.dataset.filter==="all"||tab.dataset.filter==="__updates__"||tab.dataset.filter==="__wins__"){e.preventDefault();return}
    dragTab=tab;tab.style.opacity="0.4";
  });
  tabs.addEventListener("dragend",function(){if(dragTab){dragTab.style.opacity="1";dragTab=null}});
  tabs.addEventListener("dragover",function(e){
    e.preventDefault();var tab=e.target.closest(".tab");
    if(tab&&tab!==dragTab&&tab.dataset.filter!=="all")tab.style.borderLeft="2px solid #58a6ff";
  });
  tabs.addEventListener("dragleave",function(e){var tab=e.target.closest(".tab");if(tab)tab.style.borderLeft=""});
  tabs.addEventListener("drop",function(e){
    e.preventDefault();var tab=e.target.closest(".tab");if(tab)tab.style.borderLeft="";
    if(!tab||!dragTab||tab===dragTab)return;
    tabs.insertBefore(dragTab,tab);
    var newOrder=[];tabs.querySelectorAll(".tab").forEach(function(t){if(t.dataset.filter&&t.dataset.filter!=="all"&&t.dataset.filter!=="__updates__"&&t.dataset.filter!=="__wins__")newOrder.push(t.dataset.filter)});
    projects=newOrder;saveProjectsList();
  });
})();

// === Google Sheets Sync ===
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzJ8wrYPiJYVxD15I_XX0b_tMHUUe4iMIA3eAdgLv5Q9lGqyOc1TKYPx78VvYKAZ900SA/exec";
var syncInProgress = false;

function fixDate(d) {
  if (!d) return "";
  if (typeof d === "string" && d.indexOf("T") > -1) return d.split("T")[0];
  return String(d);
}

function syncToCloud() {
  if (syncInProgress) return;
  syncInProgress = true;
  var btn = document.getElementById("syncBtn");
  if (btn) btn.textContent = "Syncing...";
  var itemsForCloud = items.map(function(i){var c=JSON.parse(JSON.stringify(i));c.subtasksJson=JSON.stringify(c.subtasks||[]);delete c.subtasks;return c});
  var payload = {action: "save", app: "ai", data: {items: itemsForCloud, updates: updates, projects: projects}};
  fetch(SCRIPT_URL, {method: "POST", body: JSON.stringify(payload), headers: {"Content-Type": "text/plain"}})
    .then(function(r) { return r.json(); })
    .then(function(d) { syncInProgress = false; if (btn) btn.innerHTML = "&#9729; Sync"; console.log("Synced to cloud:", d.timestamp); })
    .catch(function(e) { syncInProgress = false; if (btn) btn.innerHTML = "&#9729; Sync"; console.warn("Sync failed:", e); });
}

function loadFromCloud() {
  fetch(SCRIPT_URL + "?action=load&app=ai")
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var changed = false;
      if (d.items && d.items.length > 0) {
        d.items.forEach(function(item) {
          if (item.dueDate) item.dueDate = fixDate(item.dueDate);
          if (item.dateAdded) item.dateAdded = fixDate(item.dateAdded);
          if (item.subtasksJson){try{item.subtasks=JSON.parse(item.subtasksJson)}catch(e){item.subtasks=[]}delete item.subtasksJson}
          migrateItem(item);
        });
        var cloudIds = d.items.map(function(i) { return i.id; });
        var localOnly = items.filter(function(i) { return cloudIds.indexOf(i.id) === -1; });
        items = d.items.concat(localOnly);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        localStorage.setItem(STORAGE_KEY+"_ver", String(EMBEDDED_VERSION));
        changed = true;
      }
      if (d.updates && d.updates.length > 0) {
        d.updates.forEach(function(u) { if (u.date) u.date = fixDate(u.date); });
        var cloudUIds = d.updates.map(function(u) { return u.id; });
        var localOnlyU = updates.filter(function(u) { return cloudUIds.indexOf(u.id) === -1; });
        updates = d.updates.concat(localOnlyU);
        localStorage.setItem(UPDATES_KEY, JSON.stringify(updates));
        changed = true;
      }
      // Only use cloud projects if they are valid strings
      if (d.projects && d.projects.length > 0 && typeof d.projects[0] === "string") {
        projects = d.projects;
        localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
      }
      if (changed) render();
      console.log("Loaded from cloud");
    })
    .catch(function(e) { console.warn("Cloud load failed, using local:", e); });
}

// Wrap save functions to also sync (debounced to avoid hammering the endpoint)
var _origSaveItems = saveItems;
saveItems = function() { _origSaveItems(); debouncedSync(); };
var _origSaveUpdates = saveUpdates;
saveUpdates = function() { _origSaveUpdates(); debouncedSync(); };
var _origSaveProjectsList = saveProjectsList;
saveProjectsList = function() { _origSaveProjectsList(); debouncedSync(); };


// Sync button click
document.getElementById("syncBtn").addEventListener("click", function() { syncToCloud(); });

// Load from cloud on startup
loadFromCloud();

render();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
